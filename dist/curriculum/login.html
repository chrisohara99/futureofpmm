    <style>
        :root {
            --dark-slate: #44546A;
            --sap-orange: #ED7D31;
            --sap-blue: #4472C4;
            --light-gray: #E7E6E6;
            --text: #2B3A4A;
            --bg: #FAFAFA;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        
        header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo img { height: 135px; width: auto; }
        nav { display: flex; align-items: center; gap: 0.5rem; }
        nav > a { padding: 0.5rem 1rem; text-decoration: none; color: #6b7280; font-size: 0.9rem; font-weight: 500; border-radius: 6px; transition: all 0.2s; }
        nav > a:hover { color: #3b82f6; background: #f3f4f6; }
        .nav-btn { background: var(--sap-orange); color: white !important; padding: 0.5rem 1rem; border-radius: 4px; font-weight: 500; }
        .nav-btn:hover { background: #d66a1f; }
        
        @media (max-width: 900px) {
            .logo img { height: 70px !important; }
            nav { display: none; }
        }
        
        .hero {
            background: linear-gradient(135deg, var(--dark-slate) 0%, var(--sap-blue) 100%);
            padding: 3rem 2rem;
            color: white;
            text-align: center;
        }
        .hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.1rem; opacity: 0.9; }
        
        main {
            max-width: 420px;
            margin: -2rem auto 3rem;
            padding: 0 1rem;
        }
        
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .login-card h2 {
            font-size: 1.3rem;
            color: var(--dark-slate);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .login-card .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: var(--dark-slate);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--sap-blue);
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--sap-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: var(--dark-slate); }
        .submit-btn:disabled { background: var(--light-gray); cursor: not-allowed; }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #999;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--light-gray);
        }
        .divider span { padding: 0 1rem; }
        
        .signup-link {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        .signup-link a {
            color: var(--sap-blue);
            text-decoration: none;
            font-weight: 500;
        }
        .signup-link a:hover { text-decoration: underline; }
        
        .message {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .message.show { display: block; }
        .message.error { background: #FFEBEE; color: #C62828; }
        
        .magic-icon { text-align: center; font-size: 3rem; margin-bottom: 1rem; }
    </style>

<main>
    <div class="login-card">
        <div class="magic-icon">🔐</div>
        <h2>Sign In</h2>
        <p class="subtitle">Enter your SAP email to continue.</p>
        
        <div class="message" id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">SAP Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@sap.com" required>
            </div>
            
            <button type="submit" class="submit-btn">Continue →</button>
        </form>
        
        <div class="divider"><span>or</span></div>
        
        <p class="signup-link">New here? <a href="signup.html">Create an account</a></p>
    </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yyqzkczutlidhgyiyawc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cXprY3p1dGxpZGhneWl5YXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NjY0NzksImV4cCI6MjA5MDA0MjQ3OX0.B4mHnxZ9Ap31e4w3uE4cW6cWZvKgiLnLOcmbNbeCoTI';

const ALLOWED_DOMAINS = ['sap.com'];
const ADMIN_EMAILS = ['christopher.ohara@sap.com', 'chrisohara1968@gmail.com'];

let supabaseClient = null;
if (typeof supabase !== 'undefined' && supabase.createClient) {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function isAllowedEmail(email) {
    const emailLower = email.toLowerCase();
    if (ADMIN_EMAILS.includes(emailLower)) return true;
    const domain = emailLower.split('@')[1];
    return ALLOWED_DOMAINS.includes(domain);
}

document.addEventListener('DOMContentLoaded', async function() {
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    
    // Check if already logged in AND has valid profile
    const directUser = localStorage.getItem('pmm_direct_user');
    if (directUser) {
        try {
            const userData = JSON.parse(directUser);
            // Verify profile exists in database
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('id')
                .eq('email', userData.email.toLowerCase())
                .single();
            
            if (profile) {
                window.location.href = '/curriculum/';
                return;
            } else {
                // Profile doesn't exist - clear bad localStorage and redirect to signup
                localStorage.removeItem('pmm_direct_user');
                message.textContent = 'Please complete signup first.';
                message.className = 'message error show';
                setTimeout(() => {
                    window.location.href = '/curriculum/signup.html?email=' + encodeURIComponent(userData.email);
                }, 1500);
                return;
            }
        } catch (e) {
            localStorage.removeItem('pmm_direct_user');
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim().toLowerCase();
        const btn = form.querySelector('button');
        
        if (!isAllowedEmail(email)) {
            message.textContent = 'Please use your @sap.com email address.';
            message.className = 'message error show';
            return;
        }
        
        btn.disabled = true;
        btn.textContent = 'Checking...';
        
        try {
            // Check if profile exists via serverless function (bypasses client-side Supabase issues)
            const checkRes = await fetch('/.netlify/functions/check-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            
            const result = await checkRes.json();
            console.log('Login lookup for:', email, 'Result:', result);
            
            if (result.error) {
                console.error('Server error:', result.error);
                message.textContent = 'Server error. Please try again.';
                message.className = 'message error show';
                btn.disabled = false;
                btn.textContent = 'Continue →';
                return;
            }
            
            if (!result.exists) {
                // No profile - redirect to signup
                message.textContent = 'No account found. Redirecting to signup...';
                message.className = 'message error show';
                setTimeout(() => {
                    window.location.href = '/curriculum/signup.html?email=' + encodeURIComponent(email);
                }, 1500);
                return;
            }
            
            // Profile exists - store and continue
            const userData = {
                email: email,
                firstName: result.firstName,
                lastName: result.lastName,
                id: result.id,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem('pmm_direct_user', JSON.stringify(userData));
            
            // Redirect to Intro (starting point)
            window.location.href = '/curriculum/intro.html';
            
        } catch (err) {
            console.error('Login error:', err);
            message.textContent = 'Something went wrong. Please try again.';
            message.className = 'message error show';
            btn.disabled = false;
            btn.textContent = 'Continue →';
        }
    });
});
</script>
