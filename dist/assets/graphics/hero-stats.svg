<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d4a6f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="120" rx="12" fill="url(#bg)"/>
  
  <!-- Stat 1: 181 -->
  <g transform="translate(133, 60)">
    <text text-anchor="middle" y="-10" fill="#ffffff" font-family="Inter, sans-serif" font-size="42" font-weight="700">181</text>
    <text text-anchor="middle" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-transform="uppercase" letter-spacing="1">PMMs Enrolled</text>
  </g>
  
  <!-- Divider -->
  <line x1="266" y1="30" x2="266" y2="90" stroke="#475569" stroke-width="1"/>
  
  <!-- Stat 2: 73% -->
  <g transform="translate(400, 60)">
    <text text-anchor="middle" y="-10" fill="#0070f2" font-family="Inter, sans-serif" font-size="42" font-weight="700">73%</text>
    <text text-anchor="middle" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-transform="uppercase" letter-spacing="1">Pass Rate</text>
  </g>
  
  <!-- Divider -->
  <line x1="533" y1="30" x2="533" y2="90" stroke="#475569" stroke-width="1"/>
  
  <!-- Stat 3: 9.1 -->
  <g transform="translate(666, 60)">
    <text text-anchor="middle" y="-10" fill="#22c55e" font-family="Inter, sans-serif" font-size="42" font-weight="700">9.1</text>
    <text text-anchor="middle" y="20" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-transform="uppercase" letter-spacing="1">NPS Score</text>
  </g>
</svg>