<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .era-label { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .year { font: 600 12px system-ui, sans-serif; fill: #6b7280; }
      .desc { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
      .highlight { font: 600 11px system-ui, sans-serif; fill: #2563eb; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Marketing Technology Evolution</text>
  
  <!-- Timeline base -->
  <line x1="80" y1="140" x2="720" y2="140" stroke="#e5e7eb" stroke-width="4"/>
  
  <!-- Era 1: DMP -->
  <circle cx="160" cy="140" r="20" fill="#f59e0b"/>
  <text x="160" y="145" text-anchor="middle" fill="white" font-weight="bold" font-size="12">DMP</text>
  <text x="160" y="100" text-anchor="middle" class="year">2012-2018</text>
  <text x="160" y="180" text-anchor="middle" class="era-label">Cookie Era</text>
  <text x="160" y="198" text-anchor="middle" class="desc">Third-party data</text>
  <text x="160" y="214" text-anchor="middle" class="desc">Audience segments</text>
  <text x="160" y="230" text-anchor="middle" class="desc">Programmatic buying</text>
  
  <!-- Era 2: CDP -->
  <circle cx="340" cy="140" r="20" fill="#3b82f6"/>
  <text x="340" y="145" text-anchor="middle" fill="white" font-weight="bold" font-size="12">CDP</text>
  <text x="340" y="100" text-anchor="middle" class="year">2018-2024</text>
  <text x="340" y="180" text-anchor="middle" class="era-label">First-Party Era</text>
  <text x="340" y="198" text-anchor="middle" class="desc">Unified profiles</text>
  <text x="340" y="214" text-anchor="middle" class="desc">Identity resolution</text>
  <text x="340" y="230" text-anchor="middle" class="desc">Activation orchestration</text>
  
  <!-- Era 3: Agentic -->
  <circle cx="520" cy="140" r="20" fill="#10b981"/>
  <text x="520" y="145" text-anchor="middle" fill="white" font-weight="bold" font-size="10">AGENT</text>
  <text x="520" y="100" text-anchor="middle" class="year">2024-2028</text>
  <text x="520" y="180" text-anchor="middle" class="era-label">Agentic Era</text>
  <text x="520" y="198" text-anchor="middle" class="desc">AI-powered buyers</text>
  <text x="520" y="214" text-anchor="middle" class="desc">Autonomous research</text>
  <text x="520" y="230" text-anchor="middle" class="desc">Machine-readable positioning</text>
  
  <!-- Era 4: Future -->
  <circle cx="680" cy="140" r="20" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="4"/>
  <text x="680" y="145" text-anchor="middle" fill="white" font-weight="bold" font-size="12">?</text>
  <text x="680" y="100" text-anchor="middle" class="year">2028+</text>
  <text x="680" y="180" text-anchor="middle" class="era-label">Autonomous Era</text>
  <text x="680" y="198" text-anchor="middle" class="desc">Agent-to-agent</text>
  <text x="680" y="214" text-anchor="middle" class="desc">Automated procurement</text>
  <text x="680" y="230" text-anchor="middle" class="desc">Human oversight only</text>
  
  <!-- Arrows -->
  <path d="M185 140 L305 140" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M365 140 L485 140" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M545 140 L645 140" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d1d5db"/>
    </marker>
  </defs>
  
  <!-- "You are here" indicator -->
  <rect x="490" y="55" width="60" height="22" rx="4" fill="#10b981"/>
  <text x="520" y="70" text-anchor="middle" fill="white" font-size="10" font-weight="600">YOU ARE HERE</text>
  <line x1="520" y1="77" x2="520" y2="118" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
</svg>