<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .category { font: bold 14px system-ui, sans-serif; fill: white; }
      .tool { font: 600 11px system-ui, sans-serif; fill: #1f2937; }
      .desc { font: 400 10px system-ui, sans-serif; fill: #6b7280; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Demo Platform Landscape</text>
  
  <!-- Axis labels -->
  <text x="400" y="405" text-anchor="middle" class="label">INTERACTIVITY →</text>
  <text x="35" y="220" text-anchor="middle" class="label" transform="rotate(-90, 35, 220)">PRODUCTION VALUE →</text>
  
  <!-- Grid -->
  <rect x="80" y="60" width="640" height="320" fill="#f9fafb" stroke="#e5e7eb"/>
  <line x1="80" y1="220" x2="720" y2="220" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4"/>
  <line x1="400" y1="60" x2="400" y2="380" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Category 1: Video Platforms (Low interactivity, High production) -->
  <rect x="100" y="80" width="200" height="120" rx="8" fill="#8b5cf6"/>
  <text x="200" y="105" text-anchor="middle" class="category">📹 VIDEO PLATFORMS</text>
  
  <rect x="115" y="115" width="70" height="30" rx="4" fill="#ede9fe"/>
  <text x="150" y="135" text-anchor="middle" class="tool">Loom</text>
  
  <rect x="195" y="115" width="90" height="30" rx="4" fill="#ede9fe"/>
  <text x="240" y="135" text-anchor="middle" class="tool">Vidyard</text>
  
  <rect x="115" y="150" width="90" height="30" rx="4" fill="#ede9fe"/>
  <text x="160" y="170" text-anchor="middle" class="tool">Consensus</text>
  
  <text x="200" y="195" text-anchor="middle" class="desc">Pre-recorded, one-way</text>
  
  <!-- Category 2: Environment Platforms (High interactivity, High production) -->
  <rect x="420" y="80" width="280" height="120" rx="8" fill="#3b82f6"/>
  <text x="560" y="105" text-anchor="middle" class="category">🏗️ ENVIRONMENT PLATFORMS</text>
  
  <rect x="435" y="115" width="80" height="30" rx="4" fill="#dbeafe"/>
  <text x="475" y="135" text-anchor="middle" class="tool">Demostack</text>
  
  <rect x="525" y="115" width="70" height="30" rx="4" fill="#dbeafe"/>
  <text x="560" y="135" text-anchor="middle" class="tool">Reprise</text>
  
  <rect x="605" y="115" width="80" height="30" rx="4" fill="#dbeafe"/>
  <text x="645" y="135" text-anchor="middle" class="tool">Saleo</text>
  
  <rect x="470" y="150" width="70" height="30" rx="4" fill="#dbeafe"/>
  <text x="505" y="170" text-anchor="middle" class="tool">Walnut</text>
  
  <text x="560" y="195" text-anchor="middle" class="desc">Full product clones, data overlays</text>
  
  <!-- Category 3: Static Content (Low interactivity, Low production) -->
  <rect x="100" y="250" width="200" height="110" rx="8" fill="#6b7280"/>
  <text x="200" y="275" text-anchor="middle" class="category">📄 STATIC CONTENT</text>
  
  <rect x="115" y="290" width="80" height="25" rx="4" fill="#e5e7eb"/>
  <text x="155" y="308" text-anchor="middle" class="tool">PDFs</text>
  
  <rect x="205" y="290" width="80" height="25" rx="4" fill="#e5e7eb"/>
  <text x="245" y="308" text-anchor="middle" class="tool">Slides</text>
  
  <text x="200" y="350" text-anchor="middle" class="desc">Zero interactivity</text>
  
  <!-- Category 4: Interactive Builders (High interactivity, Lower production) -->
  <rect x="420" y="250" width="280" height="110" rx="8" fill="#10b981"/>
  <text x="560" y="275" text-anchor="middle" class="category">🎮 INTERACTIVE BUILDERS</text>
  
  <rect x="435" y="295" width="75" height="25" rx="4" fill="#dcfce7"/>
  <text x="473" y="312" text-anchor="middle" class="tool">Navattic</text>
  
  <rect x="520" y="295" width="70" height="25" rx="4" fill="#dcfce7"/>
  <text x="555" y="312" text-anchor="middle" class="tool">Arcade</text>
  
  <rect x="600" y="295" width="85" height="25" rx="4" fill="#dcfce7"/>
  <text x="643" y="312" text-anchor="middle" class="tool">Storylane</text>
  
  <text x="560" y="350" text-anchor="middle" class="desc">Click-through tours, PLG-friendly</text>
  
  <!-- Best for callouts -->
  <rect x="320" y="80" width="90" height="20" rx="3" fill="#f0f9ff" stroke="#3b82f6"/>
  <text x="365" y="93" text-anchor="middle" font-size="9" fill="#1d4ed8">Enterprise sales</text>
  
  <rect x="320" y="265" width="90" height="20" rx="3" fill="#f0fdf4" stroke="#10b981"/>
  <text x="365" y="278" text-anchor="middle" font-size="9" fill="#047857">PLG / self-serve</text>
</svg>