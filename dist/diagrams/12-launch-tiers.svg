<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .tier-title { font: bold 16px system-ui, sans-serif; fill: white; }
      .section { font: bold 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .effort { font: bold 12px system-ui, sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Launch Tier Framework</text>
  
  <!-- Tier 1 -->
  <rect x="50" y="60" width="230" height="340" rx="8" fill="#8b5cf6"/>
  <text x="165" y="90" text-anchor="middle" class="tier-title">🚀 TIER 1</text>
  <text x="165" y="110" text-anchor="middle" fill="#ede9fe" font-size="12">Major Launch</text>
  
  <rect x="65" y="125" width="200" height="120" rx="4" fill="#ede9fe"/>
  <text x="75" y="142" class="section">ACTIVITIES</text>
  <text x="75" y="158" class="item">• Press release + media outreach</text>
  <text x="75" y="172" class="item">• Analyst briefings</text>
  <text x="75" y="186" class="item">• Executive keynote content</text>
  <text x="75" y="200" class="item">• Customer video testimonials</text>
  <text x="75" y="214" class="item">• Full sales enablement kit</text>
  <text x="75" y="228" class="item">• Paid media campaign</text>
  
  <rect x="65" y="250" width="200" height="70" rx="4" fill="#ede9fe"/>
  <text x="75" y="267" class="section">CHANNELS</text>
  <text x="75" y="283" class="item">• All owned properties</text>
  <text x="75" y="297" class="item">• Paid social + display</text>
  <text x="75" y="311" class="item">• Press + analyst + influencers</text>
  
  <rect x="65" y="325" width="200" height="55" rx="4" fill="#7c3aed"/>
  <text x="165" y="348" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EFFORT</text>
  <text x="165" y="368" text-anchor="middle" fill="white" font-size="16" font-weight="bold">6-8 weeks</text>
  
  <!-- Tier 2 -->
  <rect x="285" y="60" width="230" height="340" rx="8" fill="#3b82f6"/>
  <text x="400" y="90" text-anchor="middle" class="tier-title">📢 TIER 2</text>
  <text x="400" y="110" text-anchor="middle" fill="#dbeafe" font-size="12">Feature Launch</text>
  
  <rect x="300" y="125" width="200" height="120" rx="4" fill="#dbeafe"/>
  <text x="310" y="142" class="section">ACTIVITIES</text>
  <text x="310" y="158" class="item">• Blog post + social</text>
  <text x="310" y="172" class="item">• Email to customer base</text>
  <text x="310" y="186" class="item">• Product update webinar</text>
  <text x="310" y="200" class="item">• Sales one-pager</text>
  <text x="310" y="214" class="item">• Documentation update</text>
  <text x="310" y="228" class="item">• In-app announcement</text>
  
  <rect x="300" y="250" width="200" height="70" rx="4" fill="#dbeafe"/>
  <text x="310" y="267" class="section">CHANNELS</text>
  <text x="310" y="283" class="item">• Owned properties</text>
  <text x="310" y="297" class="item">• Organic social</text>
  <text x="310" y="311" class="item">• Email + in-product</text>
  
  <rect x="300" y="325" width="200" height="55" rx="4" fill="#1d4ed8"/>
  <text x="400" y="348" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EFFORT</text>
  <text x="400" y="368" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2-3 weeks</text>
  
  <!-- Tier 3 -->
  <rect x="520" y="60" width="230" height="340" rx="8" fill="#10b981"/>
  <text x="635" y="90" text-anchor="middle" class="tier-title">📝 TIER 3</text>
  <text x="635" y="110" text-anchor="middle" fill="#d1fae5" font-size="12">Minor Update</text>
  
  <rect x="535" y="125" width="200" height="120" rx="4" fill="#d1fae5"/>
  <text x="545" y="142" class="section">ACTIVITIES</text>
  <text x="545" y="158" class="item">• Release notes</text>
  <text x="545" y="172" class="item">• Documentation update</text>
  <text x="545" y="186" class="item">• Quick social post</text>
  <text x="545" y="200" class="item">• Internal Slack announcement</text>
  <text x="545" y="214" class="item">• Knowledge base article</text>
  <text x="545" y="228" class="item"></text>
  
  <rect x="535" y="250" width="200" height="70" rx="4" fill="#d1fae5"/>
  <text x="545" y="267" class="section">CHANNELS</text>
  <text x="545" y="283" class="item">• Product changelog</text>
  <text x="545" y="297" class="item">• Documentation site</text>
  <text x="545" y="311" class="item">• Support channels</text>
  
  <rect x="535" y="325" width="200" height="55" rx="4" fill="#047857"/>
  <text x="635" y="348" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EFFORT</text>
  <text x="635" y="368" text-anchor="middle" fill="white" font-size="16" font-weight="bold">2-3 days</text>
</svg>