<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .era { font: bold 14px system-ui, sans-serif; fill: white; }
      .year { font: bold 12px system-ui, sans-serif; fill: #6b7280; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">PMM Role Evolution: 2020 → 2030</text>
  
  <!-- Timeline -->
  <line x1="100" y1="85" x2="700" y2="85" stroke="#e5e7eb" stroke-width="4"/>
  
  <!-- Era 1: 2020 -->
  <circle cx="150" cy="85" r="15" fill="#6b7280"/>
  <text x="150" y="90" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2020</text>
  
  <rect x="80" y="110" width="140" height="200" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="150" y="135" text-anchor="middle" class="era" fill="#4b5563">PRODUCTION ERA</text>
  
  <text x="95" y="160" class="label">TIME SPENT:</text>
  <rect x="95" y="168" width="110" height="18" rx="3" fill="#e5e7eb"/>
  <text x="100" y="181" class="item">60% Artifact creation</text>
  <rect x="95" y="190" width="110" height="18" rx="3" fill="#e5e7eb"/>
  <text x="100" y="203" class="item">25% Coordination</text>
  <rect x="95" y="212" width="110" height="18" rx="3" fill="#e5e7eb"/>
  <text x="100" y="225" class="item">15% Strategy</text>
  
  <text x="95" y="250" class="label">VALUE METRIC:</text>
  <text x="95" y="270" class="item">Deliverables shipped</text>
  <text x="95" y="285" class="item">(decks, docs, pages)</text>
  
  <!-- Arrow -->
  <line x1="230" y1="210" x2="280" y2="210" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr4)"/>
  
  <!-- Era 2: 2025 (now) -->
  <circle cx="400" cy="85" r="20" fill="#3b82f6"/>
  <text x="400" y="90" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2025</text>
  
  <rect x="290" y="110" width="220" height="200" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" class="era" fill="#1d4ed8">TRANSITION ERA</text>
  
  <text x="305" y="160" class="label">TIME SPENT:</text>
  <rect x="305" y="168" width="190" height="18" rx="3" fill="#eff6ff"/>
  <text x="310" y="181" class="item">35% Artifact creation (agent-assisted)</text>
  <rect x="305" y="190" width="190" height="18" rx="3" fill="#eff6ff"/>
  <text x="310" y="203" class="item">30% Agent direction + review</text>
  <rect x="305" y="212" width="190" height="18" rx="3" fill="#eff6ff"/>
  <text x="310" y="225" class="item">35% Strategy + judgment</text>
  
  <text x="305" y="250" class="label">VALUE METRIC:</text>
  <text x="305" y="270" class="item">Mix of outputs + outcomes</text>
  <text x="305" y="285" class="item">(learning new model)</text>
  
  <!-- You are here -->
  <rect x="375" y="50" width="50" height="18" rx="3" fill="#3b82f6"/>
  <text x="400" y="63" text-anchor="middle" fill="white" font-size="8" font-weight="600">NOW</text>
  
  <!-- Arrow -->
  <line x1="520" y1="210" x2="570" y2="210" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr4)"/>
  
  <!-- Era 3: 2030 -->
  <circle cx="650" cy="85" r="15" fill="#10b981"/>
  <text x="650" y="90" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2030</text>
  
  <rect x="580" y="110" width="140" height="200" rx="8" fill="#dcfce7" stroke="#10b981"/>
  <text x="650" y="135" text-anchor="middle" class="era" fill="#047857">JUDGMENT ERA</text>
  
  <text x="595" y="160" class="label">TIME SPENT:</text>
  <rect x="595" y="168" width="110" height="18" rx="3" fill="#f0fdf4"/>
  <text x="600" y="181" class="item">10% Creation</text>
  <rect x="595" y="190" width="110" height="18" rx="3" fill="#f0fdf4"/>
  <text x="600" y="203" class="item">30% Agent direction</text>
  <rect x="595" y="212" width="110" height="18" rx="3" fill="#f0fdf4"/>
  <text x="600" y="225" class="item">60% Strategy</text>
  
  <text x="595" y="250" class="label">VALUE METRIC:</text>
  <text x="595" y="270" class="item">Business outcomes</text>
  <text x="595" y="285" class="item">(pipeline, win rate)</text>
  
  <!-- Bottom note -->
  <text x="400" y="330" text-anchor="middle" class="label">The deliverables still get produced — just differently, at different speed</text>
</svg>