<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Office Hours Archive | Future of PMM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #f97316;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            min-height: 100vh;
            padding: 60px 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        h1 span { color: var(--accent); }
        .subtitle {
            color: var(--muted);
            font-size: 18px;
            margin-bottom: 40px;
        }
        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .archive-item {
            background: var(--card);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .archive-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .archive-info h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .archive-info p {
            color: var(--muted);
            font-size: 14px;
        }
        .archive-date {
            background: var(--accent);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Office Hours <span>Archive</span></h1>
        <p class="subtitle">All past session slides</p>
        
        <div class="archive-list">
            <a href="2026-06-10.html" class="archive-item">
                <div class="archive-info">
                    <h3>🎙️ Session #1 — First Office Hours!</h3>
                    <p>Stats snapshot, What's New (Unit 8, Launch Planner), Tools Overview, Go Deeper resources, Tips & Advice</p>
                </div>
                <span class="archive-date">June 10, 2026</span>
            </a>
            
            <!-- Future sessions will be added here -->
        </div>
        
        <a href="/curriculum/" class="back-link">← Back to Curriculum</a>
    </div>
</body>
</html>
