<!DOCTYPE html>
<html lang="en">
<head>
<script src="/assets/js/auth-guard.js"></script>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Feedback Queue | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-slate: #44546A;
            --sap-blue: #4472C4;
            --gold: #FFC000;
            --green: #70AD47;
            --red: #C00000;
            --orange: #ED7D31;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: #1e293b; line-height: 1.6; }
        .header { background: var(--dark-slate); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; }
        .header a { color: rgba(255,255,255,0.8); text-decoration: none; }
        main { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .status { padding: 1rem; background: #fef3c7; border-radius: 8px; margin-bottom: 1rem; }
        .queue-item { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #e2e8f0; }
        .queue-item.priority-high { border-left-color: var(--red); }
        .queue-item.priority-medium { border-left-color: var(--orange); }
        .queue-item.priority-low { border-left-color: var(--green); }
        .queue-title { font-size: 1.1rem; font-weight: 600; color: var(--dark-slate); margin-bottom: 0.5rem; }
        .queue-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 1rem; }
        .queue-body { background: #f8fafc; padding: 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; }
        .queue-body p { margin-bottom: 0.5rem; }
        .queue-body strong { color: var(--dark-slate); }
        .btn { padding: 0.4rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; background: white; font-size: 0.85rem; cursor: pointer; margin-right: 0.5rem; margin-bottom: 0.5rem; }
        .btn:hover { background: #f1f5f9; }
        .btn-high { border-color: var(--red); color: var(--red); }
        .btn-medium { border-color: var(--orange); color: var(--orange); }
        .btn-low { border-color: var(--green); color: var(--green); }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-left: 0.5rem; }
        .badge-new { background: #fef3c7; color: #92400e; }
        .badge-high { background: #fee2e2; color: var(--red); }
        .badge-medium { background: #ffedd5; color: var(--orange); }
        .badge-low { background: #d1fae5; color: #065f46; }
        .empty { text-align: center; padding: 3rem; color: #64748b; }
        #loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header class="header">
        <h1>🗂️ Lab Feedback Queue</h1>
        <a href="/curriculum/labs/">← Back to Labs</a>
    </header>
    
    <main>
        <div id="status" class="status">Loading...</div>
        <div id="queue"></div>
    </main>
    
    <script>
        const SUPABASE_URL = 'https://yyqzkczutlidhgyiyawc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cXprY3p1dGxpZGhneWl5YXdjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ2NjQ3OSwiZXhwIjoyMDkwMDQyNDc5fQ.0s65OtVUqKhvyfmf0e2bz23urbnsMegHLZeHOeqjw0E';
        
        let items = [];
        
        async function loadData() {
            try {
                const res = await fetch(SUPABASE_URL + '/rest/v1/lab_feedback?select=*&order=created_at.desc', {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY
                    }
                });
                
                if (!res.ok) {
                    throw new Error('Failed to fetch: ' + res.status);
                }
                
                items = await res.json();
                document.getElementById('status').textContent = 'Loaded ' + items.length + ' requests';
                document.getElementById('status').style.background = '#d1fae5';
                render();
            } catch (err) {
                document.getElementById('status').textContent = 'Error: ' + err.message;
                document.getElementById('status').style.background = '#fee2e2';
                console.error(err);
            }
        }
        
        function render() {
            if (items.length === 0) {
                document.getElementById('queue').innerHTML = '<div class="empty">No requests yet</div>';
                return;
            }
            
            document.getElementById('queue').innerHTML = items.map(item => {
                const d = item.data || {};
                const isLabIdea = item.type === 'suggest-lab';
                const title = isLabIdea ? (d.category || 'Lab Idea') : (d.lab + ' → ' + d.lob);
                const priorityClass = item.priority !== 'unset' ? 'priority-' + item.priority : '';
                const priorityBadge = item.priority !== 'unset' ? '<span class="badge badge-' + item.priority + '">' + item.priority.toUpperCase() + '</span>' : '';
                const statusBadge = item.status === 'new' ? '<span class="badge badge-new">NEW</span>' : '';
                
                let body = '';
                if (isLabIdea) {
                    body = '<p><strong>Category:</strong> ' + (d.category || '-') + '</p>' +
                           '<p><strong>LOBs:</strong> ' + ((d.lobs || []).join(', ') || '-') + '</p>' +
                           '<p><strong>Problem:</strong> ' + (d.problem || '-') + '</p>' +
                           '<p><strong>Inputs:</strong> ' + (d.inputs || '-') + '</p>' +
                           '<p><strong>Outputs:</strong> ' + (d.outputs || '-') + '</p>';
                } else {
                    body = '<p><strong>Lab:</strong> ' + (d.lab || '-') + '</p>' +
                           '<p><strong>LOB:</strong> ' + (d.lob || '-') + '</p>' +
                           '<p><strong>Notes:</strong> ' + (d.notes || 'None') + '</p>';
                }
                
                const date = new Date(item.created_at).toLocaleString();
                
                return '<div class="queue-item ' + priorityClass + '" data-id="' + item.id + '">' +
                    '<div class="queue-title">' + (isLabIdea ? '💡 ' : '🎯 ') + title + statusBadge + priorityBadge + '</div>' +
                    '<div class="queue-meta">From: ' + (item.submitter_name || 'Anonymous') + ' • ' + date + '</div>' +
                    '<div class="queue-body">' + body + '</div>' +
                    '<div>' +
                        '<button class="btn btn-high" onclick="setPriority(\'' + item.id + '\', \'high\')">🔴 High</button>' +
                        '<button class="btn btn-medium" onclick="setPriority(\'' + item.id + '\', \'medium\')">🟠 Medium</button>' +
                        '<button class="btn btn-low" onclick="setPriority(\'' + item.id + '\', \'low\')">🟢 Low</button>' +
                        '<button class="btn" onclick="setStatus(\'' + item.id + '\', \'done\')">✓ Done</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        
        async function setPriority(id, priority) {
            await fetch(SUPABASE_URL + '/rest/v1/lab_feedback?id=eq.' + id, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ priority: priority })
            });
            const item = items.find(i => i.id === id);
            if (item) item.priority = priority;
            render();
        }
        
        async function setStatus(id, status) {
            await fetch(SUPABASE_URL + '/rest/v1/lab_feedback?id=eq.' + id, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ status: status })
            });
            items = items.filter(i => i.id !== id);
            render();
        }
        
        // Load on page load
        loadData();
    </script>
</body>
</html>
