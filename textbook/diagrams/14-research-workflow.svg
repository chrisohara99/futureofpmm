<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .step-title { font: bold 12px system-ui, sans-serif; fill: white; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .arrow-label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Research Synthesis Workflow</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Agent-augmented research for speed + depth</text>
  
  <!-- Step 1: Web Sources -->
  <rect x="50" y="80" width="160" height="130" rx="8" fill="#3b82f6"/>
  <text x="130" y="105" text-anchor="middle" class="step-title">1. WEB SOURCES</text>
  
  <rect x="60" y="115" width="140" height="22" rx="3" fill="#dbeafe"/>
  <text x="130" y="130" text-anchor="middle" class="item">Perplexity / Search</text>
  <rect x="60" y="142" width="140" height="22" rx="3" fill="#dbeafe"/>
  <text x="130" y="157" text-anchor="middle" class="item">Industry reports</text>
  <rect x="60" y="169" width="140" height="22" rx="3" fill="#dbeafe"/>
  <text x="130" y="184" text-anchor="middle" class="item">News + analyst blogs</text>
  
  <!-- Arrow -->
  <line x1="210" y1="145" x2="240" y2="145" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Step 2: Proprietary Sources -->
  <rect x="245" y="80" width="160" height="130" rx="8" fill="#10b981"/>
  <text x="325" y="105" text-anchor="middle" class="step-title">2. PROPRIETARY</text>
  
  <rect x="255" y="115" width="140" height="22" rx="3" fill="#dcfce7"/>
  <text x="325" y="130" text-anchor="middle" class="item">Past customer interviews</text>
  <rect x="255" y="142" width="140" height="22" rx="3" fill="#dcfce7"/>
  <text x="325" y="157" text-anchor="middle" class="item">Analyst briefings</text>
  <rect x="255" y="169" width="140" height="22" rx="3" fill="#dcfce7"/>
  <text x="325" y="184" text-anchor="middle" class="item">Competitive intel</text>
  
  <!-- Arrow -->
  <line x1="405" y1="145" x2="435" y2="145" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Step 3: Agent Synthesis -->
  <rect x="440" y="80" width="160" height="130" rx="8" fill="#8b5cf6"/>
  <text x="520" y="105" text-anchor="middle" class="step-title">3. AGENT SYNTHESIS</text>
  
  <rect x="450" y="115" width="140" height="22" rx="3" fill="#ede9fe"/>
  <text x="520" y="130" text-anchor="middle" class="item">Cross-source patterns</text>
  <rect x="450" y="142" width="140" height="22" rx="3" fill="#ede9fe"/>
  <text x="520" y="157" text-anchor="middle" class="item">Gap identification</text>
  <rect x="450" y="169" width="140" height="22" rx="3" fill="#ede9fe"/>
  <text x="520" y="184" text-anchor="middle" class="item">Draft insights</text>
  
  <!-- Arrow -->
  <line x1="600" y1="145" x2="630" y2="145" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Step 4: Human Insight -->
  <rect x="635" y="80" width="130" height="130" rx="8" fill="#f59e0b"/>
  <text x="700" y="105" text-anchor="middle" class="step-title">4. HUMAN INSIGHT</text>
  
  <rect x="645" y="115" width="110" height="22" rx="3" fill="#fef3c7"/>
  <text x="700" y="130" text-anchor="middle" class="item">Strategic judgment</text>
  <rect x="645" y="142" width="110" height="22" rx="3" fill="#fef3c7"/>
  <text x="700" y="157" text-anchor="middle" class="item">Contextual nuance</text>
  <rect x="645" y="169" width="110" height="22" rx="3" fill="#fef3c7"/>
  <text x="700" y="184" text-anchor="middle" class="item">Final narrative</text>
  
  <!-- Output -->
  <rect x="250" y="260" width="300" height="80" rx="8" fill="#1f2937"/>
  <text x="400" y="290" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DIFFERENTIATED RESEARCH</text>
  <text x="400" y="312" text-anchor="middle" fill="#9ca3af" font-size="11">Timely + Substantive + Proprietary</text>
  <text x="400" y="328" text-anchor="middle" fill="#9ca3af" font-size="10">Minutes, not weeks</text>
  
  <!-- Arrows to output -->
  <line x1="130" y1="210" x2="300" y2="260" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="325" y1="210" x2="350" y2="260" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="210" x2="450" y2="260" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="210" x2="500" y2="260" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Key insight callout -->
  <rect x="580" y="280" width="180" height="60" rx="4" fill="#f0fdf4" stroke="#10b981"/>
  <text x="670" y="302" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">KEY DIFFERENTIATOR</text>
  <text x="670" y="320" text-anchor="middle" class="item">Proprietary sources = unique</text>
  <text x="670" y="333" text-anchor="middle" class="item">insights competitors can't get</text>
</svg>