<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .quad-label { font: bold 12px system-ui, sans-serif; fill: #6b7280; }
      .item { font: 500 11px system-ui, sans-serif; fill: #1f2937; }
      .axis { font: 600 12px system-ui, sans-serif; fill: #9ca3af; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Influence Landscape Map</text>
  
  <!-- Grid -->
  <rect x="100" y="60" width="600" height="360" fill="#f9fafb" stroke="#e5e7eb"/>
  <line x1="400" y1="60" x2="400" y2="420" stroke="#d1d5db" stroke-width="2"/>
  <line x1="100" y1="240" x2="700" y2="240" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="445" text-anchor="middle" class="axis">REACH →</text>
  <text x="60" y="240" text-anchor="middle" class="axis" transform="rotate(-90, 60, 240)">DEPTH OF EXPERTISE →</text>
  
  <!-- Quadrant 1: High Expertise, Low Reach - Niche Experts -->
  <rect x="100" y="60" width="300" height="180" fill="#dbeafe" opacity="0.3"/>
  <text x="250" y="85" text-anchor="middle" class="quad-label">NICHE EXPERTS</text>
  
  <circle cx="180" cy="120" r="25" fill="#3b82f6" opacity="0.8"/>
  <text x="180" y="125" text-anchor="middle" fill="white" font-size="10" font-weight="600">David</text>
  <text x="180" y="160" text-anchor="middle" class="item">CDP Institute</text>
  
  <circle cx="300" cy="150" r="20" fill="#3b82f6" opacity="0.8"/>
  <text x="300" y="155" text-anchor="middle" fill="white" font-size="9" font-weight="600">Marty</text>
  <text x="300" y="185" text-anchor="middle" class="item">Kihn (Adobe)</text>
  
  <circle cx="220" cy="200" r="18" fill="#3b82f6" opacity="0.8"/>
  <text x="220" y="205" text-anchor="middle" fill="white" font-size="8" font-weight="600">Tech</text>
  <text x="220" y="230" text-anchor="middle" class="item">Bloggers</text>
  
  <!-- Quadrant 2: High Expertise, High Reach - Major Analysts -->
  <rect x="400" y="60" width="300" height="180" fill="#dcfce7" opacity="0.3"/>
  <text x="550" y="85" text-anchor="middle" class="quad-label">MAJOR ANALYSTS</text>
  
  <circle cx="500" cy="130" r="35" fill="#10b981" opacity="0.8"/>
  <text x="500" y="135" text-anchor="middle" fill="white" font-size="11" font-weight="600">Gartner</text>
  
  <circle cx="600" cy="150" r="30" fill="#10b981" opacity="0.8"/>
  <text x="600" y="155" text-anchor="middle" fill="white" font-size="10" font-weight="600">Forrester</text>
  
  <circle cx="550" cy="200" r="22" fill="#10b981" opacity="0.8"/>
  <text x="550" y="205" text-anchor="middle" fill="white" font-size="9" font-weight="600">IDC</text>
  
  <!-- Quadrant 3: Low Expertise, Low Reach - Noise -->
  <rect x="100" y="240" width="300" height="180" fill="#fee2e2" opacity="0.3"/>
  <text x="250" y="265" text-anchor="middle" class="quad-label">NOISE</text>
  
  <circle cx="200" cy="320" r="15" fill="#ef4444" opacity="0.5"/>
  <text x="200" y="355" text-anchor="middle" class="item" fill="#9ca3af">Generic</text>
  <text x="200" y="370" text-anchor="middle" class="item" fill="#9ca3af">listicles</text>
  
  <circle cx="300" cy="350" r="12" fill="#ef4444" opacity="0.5"/>
  <text x="300" y="380" text-anchor="middle" class="item" fill="#9ca3af">AI slop</text>
  
  <!-- Quadrant 4: Low Expertise, High Reach - Mass Influencers -->
  <rect x="400" y="240" width="300" height="180" fill="#fef3c7" opacity="0.3"/>
  <text x="550" y="265" text-anchor="middle" class="quad-label">MASS INFLUENCERS</text>
  
  <circle cx="500" cy="310" r="28" fill="#f59e0b" opacity="0.8"/>
  <text x="500" y="315" text-anchor="middle" fill="white" font-size="10" font-weight="600">LinkedIn</text>
  <text x="500" y="350" text-anchor="middle" class="item">Thought leaders</text>
  
  <circle cx="620" cy="330" r="22" fill="#f59e0b" opacity="0.8"/>
  <text x="620" y="335" text-anchor="middle" fill="white" font-size="9" font-weight="600">Podcasts</text>
  
  <circle cx="550" cy="380" r="18" fill="#f59e0b" opacity="0.8"/>
  <text x="550" y="385" text-anchor="middle" fill="white" font-size="8" font-weight="600">Slack</text>
  <text x="550" y="410" text-anchor="middle" class="item">Communities</text>
</svg>