<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .step-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .step-desc { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
      .label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Enablement Feedback Loop</text>
  <text x="400" y="55" text-anchor="middle" class="label">Continuous learning system that improves with every deal</text>
  
  <!-- Center: Knowledge Base -->
  <circle cx="400" cy="220" r="70" fill="#1f2937"/>
  <text x="400" y="210" text-anchor="middle" fill="white" font-size="13" font-weight="bold">KNOWLEDGE</text>
  <text x="400" y="228" text-anchor="middle" fill="white" font-size="13" font-weight="bold">BASE</text>
  <text x="400" y="248" text-anchor="middle" fill="#9ca3af" font-size="10">Always improving</text>
  
  <!-- Step 1: Enablement Output (top) -->
  <rect x="310" y="70" width="180" height="60" rx="8" fill="#3b82f6"/>
  <text x="400" y="95" text-anchor="middle" class="step-title">1. ENABLEMENT</text>
  <text x="400" y="115" text-anchor="middle" fill="#dbeafe" font-size="11">Agent generates intel</text>
  
  <!-- Arrow down to Sales -->
  <path d="M400 130 Q 480 145 520 180" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="490" y="155" class="label">Deal-specific</text>
  
  <!-- Step 2: Sales Use (right) -->
  <rect x="530" y="180" width="150" height="80" rx="8" fill="#10b981"/>
  <text x="605" y="210" text-anchor="middle" class="step-title">2. SALES USE</text>
  <text x="605" y="230" text-anchor="middle" fill="#d1fae5" font-size="11">Rep uses in deal</text>
  <text x="605" y="245" text-anchor="middle" fill="#d1fae5" font-size="10">Win or lose</text>
  
  <!-- Arrow down to Capture -->
  <path d="M580 260 Q 540 310 480 340" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="540" y="300" class="label">Outcome data</text>
  
  <!-- Step 3: Capture (bottom) -->
  <rect x="310" y="310" width="180" height="60" rx="8" fill="#f59e0b"/>
  <text x="400" y="335" text-anchor="middle" class="step-title">3. CAPTURE</text>
  <text x="400" y="355" text-anchor="middle" fill="#fef3c7" font-size="11">Collect feedback (&lt;30 sec)</text>
  
  <!-- Arrow left to Synthesis -->
  <path d="M310 340 Q 240 310 180 260" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="220" y="310" class="label">Raw feedback</text>
  
  <!-- Step 4: Synthesis (left) -->
  <rect x="120" y="180" width="150" height="80" rx="8" fill="#8b5cf6"/>
  <text x="195" y="210" text-anchor="middle" class="step-title">4. SYNTHESIS</text>
  <text x="195" y="230" text-anchor="middle" fill="#ede9fe" font-size="11">Aggregate patterns</text>
  <text x="195" y="245" text-anchor="middle" fill="#ede9fe" font-size="10">Identify trends</text>
  
  <!-- Arrow up to Integration -->
  <path d="M220 180 Q 260 145 310 115" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="240" y="145" class="label">Patterns</text>
  
  <!-- Inner arrows to/from knowledge base -->
  <line x1="400" y1="150" x2="400" y2="150" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Outcome indicators -->
  <rect x="680" y="160" width="80" height="30" rx="4" fill="#dcfce7" stroke="#10b981"/>
  <text x="720" y="180" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">Win ✓</text>
  
  <rect x="680" y="195" width="80" height="30" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="720" y="215" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="600">Loss ✗</text>
  
  <text x="720" y="245" text-anchor="middle" class="label">Both inform</text>
  <text x="720" y="258" text-anchor="middle" class="label">the system</text>
</svg>