<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .type-title { font: bold 12px system-ui, sans-serif; fill: white; }
      .generic { font: 400 10px system-ui, sans-serif; fill: #9ca3af; }
      .specific { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Specificity Framework</text>
  <text x="400" y="55" text-anchor="middle" class="label">What makes content AI-citable and memorable</text>
  
  <!-- Type 1: Numbers -->
  <rect x="50" y="80" width="170" height="140" rx="8" fill="#3b82f6"/>
  <text x="135" y="105" text-anchor="middle" class="type-title">📊 SPECIFIC NUMBERS</text>
  
  <rect x="60" y="115" width="150" height="45" rx="4" fill="#fee2e2"/>
  <text x="70" y="130" class="label" fill="#b91c1c">❌ Generic:</text>
  <text x="70" y="145" class="generic">"Improved efficiency"</text>
  
  <rect x="60" y="165" width="150" height="45" rx="4" fill="#dcfce7"/>
  <text x="70" y="180" class="label" fill="#047857">✓ Specific:</text>
  <text x="70" y="195" class="specific">"14 hours → 90 minutes"</text>
  
  <!-- Type 2: People -->
  <rect x="235" y="80" width="170" height="140" rx="8" fill="#10b981"/>
  <text x="320" y="105" text-anchor="middle" class="type-title">👤 SPECIFIC PEOPLE</text>
  
  <rect x="245" y="115" width="150" height="45" rx="4" fill="#fee2e2"/>
  <text x="255" y="130" class="label" fill="#b91c1c">❌ Generic:</text>
  <text x="255" y="145" class="generic">"Industry experts agree"</text>
  
  <rect x="245" y="165" width="150" height="45" rx="4" fill="#dcfce7"/>
  <text x="255" y="180" class="label" fill="#047857">✓ Specific:</text>
  <text x="255" y="195" class="specific">"Angela Martinez, pricing</text>
  <text x="255" y="207" class="specific">consultant at Acme..."</text>
  
  <!-- Type 3: Contexts -->
  <rect x="420" y="80" width="170" height="140" rx="8" fill="#8b5cf6"/>
  <text x="505" y="105" text-anchor="middle" class="type-title">🏢 SPECIFIC CONTEXTS</text>
  
  <rect x="430" y="115" width="150" height="45" rx="4" fill="#fee2e2"/>
  <text x="440" y="130" class="label" fill="#b91c1c">❌ Generic:</text>
  <text x="440" y="145" class="generic">"Works for enterprises"</text>
  
  <rect x="430" y="165" width="150" height="45" rx="4" fill="#dcfce7"/>
  <text x="440" y="180" class="label" fill="#047857">✓ Specific:</text>
  <text x="440" y="195" class="specific">"Fortune 500 automotive,</text>
  <text x="440" y="207" class="specific">200+ supplier network"</text>
  
  <!-- Type 4: Stories -->
  <rect x="605" y="80" width="170" height="140" rx="8" fill="#f59e0b"/>
  <text x="690" y="105" text-anchor="middle" class="type-title">📖 SPECIFIC STORIES</text>
  
  <rect x="615" y="115" width="150" height="45" rx="4" fill="#fee2e2"/>
  <text x="625" y="130" class="label" fill="#b91c1c">❌ Generic:</text>
  <text x="625" y="145" class="generic">"Customers love it"</text>
  
  <rect x="615" y="165" width="150" height="45" rx="4" fill="#dcfce7"/>
  <text x="625" y="180" class="label" fill="#047857">✓ Specific:</text>
  <text x="625" y="195" class="specific">"When Chris's team</text>
  <text x="625" y="207" class="specific">discovered that..."</text>
  
  <!-- Why it matters -->
  <rect x="150" y="250" width="500" height="100" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">WHY SPECIFICITY WINS</text>
  <rect x="170" y="295" width="140" height="40" rx="4" fill="#dcfce7"/>
  <text x="240" y="312" text-anchor="middle" class="specific">🤖 AI systems cite</text>
  <text x="240" y="327" text-anchor="middle" class="specific">verifiable claims</text>
  
  <rect x="330" y="295" width="140" height="40" rx="4" fill="#dcfce7"/>
  <text x="400" y="312" text-anchor="middle" class="specific">🧠 Human readers</text>
  <text x="400" y="327" text-anchor="middle" class="specific">remember details</text>
  
  <rect x="490" y="295" width="140" height="40" rx="4" fill="#dcfce7"/>
  <text x="560" y="312" text-anchor="middle" class="specific">🎯 Generic = invisible</text>
  <text x="560" y="327" text-anchor="middle" class="specific">in AI-mediated search</text>
</svg>