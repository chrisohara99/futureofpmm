<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .check { font: bold 12px system-ui, sans-serif; fill: #10b981; }
      .x { font: bold 12px system-ui, sans-serif; fill: #ef4444; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">RFI Optimization Framework</text>
  <text x="400" y="55" text-anchor="middle" class="label">What AI Agents Extract vs. What Analysts Evaluate</text>
  
  <!-- Left: Agent Extraction -->
  <rect x="50" y="80" width="330" height="280" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="215" y="110" text-anchor="middle" class="section-title">🤖 Agent Extraction Layer</text>
  <text x="215" y="130" text-anchor="middle" class="label">Automated, systematic, exhaustive</text>
  
  <rect x="70" y="145" width="290" height="35" rx="4" fill="#dcfce7"/>
  <text x="85" y="160" class="check">✓</text>
  <text x="105" y="160" class="item">Specific capability claims with evidence</text>
  <text x="105" y="175" class="item" fill="#6b7280">"Processes 10M records/second with sub-100ms latency"</text>
  
  <rect x="70" y="185" width="290" height="35" rx="4" fill="#dcfce7"/>
  <text x="85" y="200" class="check">✓</text>
  <text x="105" y="200" class="item">Integration documentation completeness</text>
  <text x="105" y="215" class="item" fill="#6b7280">"Native connectors for 200+ enterprise systems"</text>
  
  <rect x="70" y="225" width="290" height="35" rx="4" fill="#dcfce7"/>
  <text x="85" y="240" class="check">✓</text>
  <text x="105" y="240" class="item">Customer proof points (named, quantified)</text>
  <text x="105" y="255" class="item" fill="#6b7280">"Acme Corp: 40% reduction in time-to-insight"</text>
  
  <rect x="70" y="265" width="290" height="35" rx="4" fill="#dcfce7"/>
  <text x="85" y="280" class="check">✓</text>
  <text x="105" y="280" class="item">Technical architecture consistency</text>
  <text x="105" y="295" class="item" fill="#6b7280">"Claims match documentation and API specs"</text>
  
  <rect x="70" y="305" width="290" height="35" rx="4" fill="#dcfce7"/>
  <text x="85" y="320" class="check">✓</text>
  <text x="105" y="320" class="item">Compliance and security certifications</text>
  <text x="105" y="335" class="item" fill="#6b7280">"SOC 2 Type II, GDPR, HIPAA"</text>
  
  <!-- Right: Analyst Judgment -->
  <rect x="420" y="80" width="330" height="280" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="585" y="110" text-anchor="middle" class="section-title">👤 Analyst Judgment Layer</text>
  <text x="585" y="130" text-anchor="middle" class="label">Contextual, strategic, experiential</text>
  
  <rect x="440" y="145" width="290" height="35" rx="4" fill="#dbeafe"/>
  <text x="455" y="160" fill="#3b82f6" font-weight="bold">◆</text>
  <text x="475" y="160" class="item">Strategic fit with buyer's context</text>
  <text x="475" y="175" class="item" fill="#6b7280">"Does this solve their actual problem?"</text>
  
  <rect x="440" y="185" width="290" height="35" rx="4" fill="#dbeafe"/>
  <text x="455" y="200" fill="#3b82f6" font-weight="bold">◆</text>
  <text x="475" y="200" class="item">Vendor trajectory and market position</text>
  <text x="475" y="215" class="item" fill="#6b7280">"Will they be around in 5 years?"</text>
  
  <rect x="440" y="225" width="290" height="35" rx="4" fill="#dbeafe"/>
  <text x="455" y="240" fill="#3b82f6" font-weight="bold">◆</text>
  <text x="475" y="240" class="item">Implementation risk assessment</text>
  <text x="475" y="255" class="item" fill="#6b7280">"Hidden complexity, team readiness"</text>
  
  <rect x="440" y="265" width="290" height="35" rx="4" fill="#dbeafe"/>
  <text x="455" y="280" fill="#3b82f6" font-weight="bold">◆</text>
  <text x="475" y="280" class="item">Reference quality interpretation</text>
  <text x="475" y="295" class="item" fill="#6b7280">"What aren't they saying?"</text>
  
  <rect x="440" y="305" width="290" height="35" rx="4" fill="#dbeafe"/>
  <text x="455" y="320" fill="#3b82f6" font-weight="bold">◆</text>
  <text x="475" y="320" class="item">Overall vendor relationship signals</text>
  <text x="475" y="335" class="item" fill="#6b7280">"Culture, responsiveness, partnership"</text>
</svg>