<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .quad-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .center { font: bold 16px system-ui, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Enablement Knowledge Base Components</text>
  
  <!-- Center circle -->
  <circle cx="400" cy="240" r="60" fill="#1f2937"/>
  <text x="400" y="235" text-anchor="middle" fill="white" font-size="12" font-weight="bold">SALES</text>
  <text x="400" y="252" text-anchor="middle" fill="white" font-size="12" font-weight="bold">ENABLEMENT</text>
  <text x="400" y="269" text-anchor="middle" fill="#9ca3af" font-size="10">Knowledge Base</text>
  
  <!-- Quadrant 1: Competitive Intelligence -->
  <rect x="80" y="60" width="280" height="160" rx="8" fill="#ef4444"/>
  <text x="220" y="90" text-anchor="middle" class="quad-title">🎯 COMPETITIVE INTELLIGENCE</text>
  
  <rect x="95" y="100" width="250" height="22" rx="3" fill="#fecaca"/>
  <text x="105" y="116" class="item">Competitor positioning summaries</text>
  <rect x="95" y="126" width="250" height="22" rx="3" fill="#fecaca"/>
  <text x="105" y="142" class="item">Differentiation matrices</text>
  <rect x="95" y="152" width="250" height="22" rx="3" fill="#fecaca"/>
  <text x="105" y="168" class="item">Objection handling guides</text>
  <rect x="95" y="178" width="250" height="22" rx="3" fill="#fecaca"/>
  <text x="105" y="194" class="item">Trap-setting questions</text>
  
  <!-- Quadrant 2: Product Intelligence -->
  <rect x="440" y="60" width="280" height="160" rx="8" fill="#3b82f6"/>
  <text x="580" y="90" text-anchor="middle" class="quad-title">📦 PRODUCT INTELLIGENCE</text>
  
  <rect x="455" y="100" width="250" height="22" rx="3" fill="#dbeafe"/>
  <text x="465" y="116" class="item">Current capabilities with evidence</text>
  <rect x="455" y="126" width="250" height="22" rx="3" fill="#dbeafe"/>
  <text x="465" y="142" class="item">Technical architecture docs</text>
  <rect x="455" y="152" width="250" height="22" rx="3" fill="#dbeafe"/>
  <text x="465" y="168" class="item">Use case documentation</text>
  <rect x="455" y="178" width="250" height="22" rx="3" fill="#dbeafe"/>
  <text x="465" y="194" class="item">Demo scripts and workflows</text>
  
  <!-- Quadrant 3: Customer Intelligence -->
  <rect x="80" y="260" width="280" height="160" rx="8" fill="#10b981"/>
  <text x="220" y="290" text-anchor="middle" class="quad-title">👥 CUSTOMER INTELLIGENCE</text>
  
  <rect x="95" y="300" width="250" height="22" rx="3" fill="#dcfce7"/>
  <text x="105" y="316" class="item">Case studies with outcomes</text>
  <rect x="95" y="326" width="250" height="22" rx="3" fill="#dcfce7"/>
  <text x="105" y="342" class="item">Reference database with context</text>
  <rect x="95" y="352" width="250" height="22" rx="3" fill="#dcfce7"/>
  <text x="105" y="368" class="item">Win/loss stories with lessons</text>
  <rect x="95" y="378" width="250" height="22" rx="3" fill="#dcfce7"/>
  <text x="105" y="394" class="item">Customer quotes by use case</text>
  
  <!-- Quadrant 4: Market Intelligence -->
  <rect x="440" y="260" width="280" height="160" rx="8" fill="#8b5cf6"/>
  <text x="580" y="290" text-anchor="middle" class="quad-title">📊 MARKET INTELLIGENCE</text>
  
  <rect x="455" y="300" width="250" height="22" rx="3" fill="#ede9fe"/>
  <text x="465" y="316" class="item">Industry-specific messaging</text>
  <rect x="455" y="326" width="250" height="22" rx="3" fill="#ede9fe"/>
  <text x="465" y="342" class="item">Buyer persona documentation</text>
  <rect x="455" y="352" width="250" height="22" rx="3" fill="#ede9fe"/>
  <text x="465" y="368" class="item">Common objections by segment</text>
  <rect x="455" y="378" width="250" height="22" rx="3" fill="#ede9fe"/>
  <text x="465" y="394" class="item">Analyst perspectives and quotes</text>
  
  <!-- Connection lines -->
  <line x1="340" y1="240" x2="360" y2="200" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="460" y1="240" x2="440" y2="200" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="340" y1="240" x2="360" y2="280" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="460" y1="240" x2="440" y2="280" stroke="#e5e7eb" stroke-width="2"/>
</svg>