<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .step { font: bold 11px system-ui, sans-serif; fill: white; }
      .desc { font: 400 10px system-ui, sans-serif; fill: #4b5563; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Self-Serve Buyer Journey Evolution</text>
  
  <!-- OLD Journey -->
  <text x="80" y="75" class="section-title">❌ Traditional Journey</text>
  <rect x="50" y="85" width="700" height="100" rx="8" fill="#fee2e2"/>
  
  <rect x="70" y="105" width="100" height="60" rx="4" fill="#ef4444"/>
  <text x="120" y="130" text-anchor="middle" class="step">Awareness</text>
  <text x="120" y="145" text-anchor="middle" fill="#fecaca" font-size="9">Ad / content</text>
  
  <line x1="175" y1="135" x2="200" y2="135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="205" y="105" width="100" height="60" rx="4" fill="#ef4444"/>
  <text x="255" y="130" text-anchor="middle" class="step">Form Fill</text>
  <text x="255" y="145" text-anchor="middle" fill="#fecaca" font-size="9">Request demo</text>
  
  <line x1="310" y1="135" x2="335" y2="135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="340" y="105" width="100" height="60" rx="4" fill="#ef4444"/>
  <text x="390" y="130" text-anchor="middle" class="step">SDR Call</text>
  <text x="390" y="145" text-anchor="middle" fill="#fecaca" font-size="9">Qualify</text>
  
  <line x1="445" y1="135" x2="470" y2="135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="475" y="105" width="100" height="60" rx="4" fill="#ef4444"/>
  <text x="525" y="130" text-anchor="middle" class="step">AE Demo</text>
  <text x="525" y="145" text-anchor="middle" fill="#fecaca" font-size="9">First product view</text>
  
  <line x1="580" y1="135" x2="605" y2="135" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="610" y="105" width="100" height="60" rx="4" fill="#b91c1c"/>
  <text x="660" y="130" text-anchor="middle" class="step">Decision</text>
  <text x="660" y="145" text-anchor="middle" fill="#fecaca" font-size="9">6-8 weeks</text>
  
  <!-- NEW Journey -->
  <text x="80" y="220" class="section-title">✅ Self-Serve Journey</text>
  <rect x="50" y="230" width="700" height="130" rx="8" fill="#dcfce7"/>
  
  <!-- Self-serve discovery block -->
  <rect x="70" y="250" width="350" height="90" rx="4" fill="#10b981"/>
  <text x="245" y="275" text-anchor="middle" class="step">SELF-SERVE DISCOVERY</text>
  <text x="245" y="295" text-anchor="middle" fill="#d1fae5" font-size="10">Before any contact with vendor</text>
  
  <rect x="85" y="305" width="70" height="25" rx="3" fill="#047857"/>
  <text x="120" y="322" text-anchor="middle" fill="#d1fae5" font-size="9">G2 Reviews</text>
  
  <rect x="160" y="305" width="70" height="25" rx="3" fill="#047857"/>
  <text x="195" y="322" text-anchor="middle" fill="#d1fae5" font-size="9">AI Search</text>
  
  <rect x="235" y="305" width="70" height="25" rx="3" fill="#047857"/>
  <text x="270" y="322" text-anchor="middle" fill="#d1fae5" font-size="9">Slack Ask</text>
  
  <rect x="310" y="305" width="95" height="25" rx="3" fill="#047857"/>
  <text x="358" y="322" text-anchor="middle" fill="#d1fae5" font-size="9">Interactive Demo</text>
  
  <line x1="425" y1="295" x2="455" y2="295" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="460" y="250" width="120" height="90" rx="4" fill="#047857"/>
  <text x="520" y="280" text-anchor="middle" class="step">Demo Call</text>
  <text x="520" y="300" text-anchor="middle" fill="#d1fae5" font-size="10">Validation only</text>
  <text x="520" y="315" text-anchor="middle" fill="#a7f3d0" font-size="9">Decision half-made</text>
  
  <line x1="585" y1="295" x2="615" y2="295" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr3)"/>
  
  <rect x="620" y="260" width="100" height="70" rx="4" fill="#065f46"/>
  <text x="670" y="290" text-anchor="middle" class="step">Decision</text>
  <text x="670" y="310" text-anchor="middle" fill="#d1fae5" font-size="9">Days, not weeks</text>
  
  <!-- Key insight -->
  <rect x="250" y="365" width="300" height="25" rx="4" fill="#f0fdf4" stroke="#10b981"/>
  <text x="400" y="382" text-anchor="middle" class="label">💡 If invisible in self-serve phase, you're not in consideration</text>
</svg>