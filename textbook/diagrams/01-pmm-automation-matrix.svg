<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .axis-label { font: 600 14px system-ui, sans-serif; fill: #6b7280; }
      .item { font: 500 11px system-ui, sans-serif; fill: #1f2937; }
      .quadrant-label { font: 600 12px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">PMM Activity Automation Matrix</text>
  
  <!-- Grid -->
  <rect x="100" y="60" width="600" height="380" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="400" y1="60" x2="400" y2="440" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Quadrant backgrounds -->
  <rect x="100" y="60" width="300" height="190" fill="#fef3c7" opacity="0.5"/>
  <rect x="400" y="60" width="300" height="190" fill="#dcfce7" opacity="0.5"/>
  <rect x="100" y="250" width="300" height="190" fill="#fee2e2" opacity="0.5"/>
  <rect x="400" y="250" width="300" height="190" fill="#dbeafe" opacity="0.5"/>
  
  <!-- Axis labels -->
  <text x="400" y="470" text-anchor="middle" class="axis-label">AUTOMATION POTENTIAL →</text>
  <text x="50" y="250" text-anchor="middle" class="axis-label" transform="rotate(-90, 50, 250)">STRATEGIC VALUE →</text>
  
  <!-- Quadrant labels -->
  <text x="250" y="85" text-anchor="middle" class="quadrant-label">AUGMENT</text>
  <text x="550" y="85" text-anchor="middle" class="quadrant-label">DELEGATE</text>
  <text x="250" y="425" text-anchor="middle" class="quadrant-label">PROTECT</text>
  <text x="550" y="425" text-anchor="middle" class="quadrant-label">AUTOMATE</text>
  
  <!-- High Value, Low Automation (AUGMENT) -->
  <circle cx="180" cy="120" r="6" fill="#f59e0b"/>
  <text x="192" y="124" class="item">Positioning Strategy</text>
  <circle cx="280" cy="150" r="6" fill="#f59e0b"/>
  <text x="292" y="154" class="item">Pricing Decisions</text>
  <circle cx="200" cy="180" r="6" fill="#f59e0b"/>
  <text x="212" y="184" class="item">Launch Planning</text>
  <circle cx="320" cy="200" r="6" fill="#f59e0b"/>
  <text x="332" y="204" class="item">Analyst Relations</text>
  
  <!-- High Value, High Automation (DELEGATE) -->
  <circle cx="480" cy="130" r="6" fill="#10b981"/>
  <text x="492" y="134" class="item">Competitive Monitoring</text>
  <circle cx="520" cy="160" r="6" fill="#10b981"/>
  <text x="532" y="164" class="item">Market Research Synthesis</text>
  <circle cx="580" cy="190" r="6" fill="#10b981"/>
  <text x="592" y="194" class="item">Content Drafting</text>
  <circle cx="450" cy="220" r="6" fill="#10b981"/>
  <text x="462" y="224" class="item">Battlecard Updates</text>
  
  <!-- Low Value, Low Automation (PROTECT) -->
  <circle cx="180" cy="290" r="6" fill="#ef4444"/>
  <text x="192" y="294" class="item">Executive Relationships</text>
  <circle cx="220" cy="320" r="6" fill="#ef4444"/>
  <text x="232" y="324" class="item">Cross-functional Alignment</text>
  <circle cx="280" cy="350" r="6" fill="#ef4444"/>
  <text x="292" y="354" class="item">Stakeholder Navigation</text>
  <circle cx="200" cy="380" r="6" fill="#ef4444"/>
  <text x="212" y="384" class="item">Culture Reading</text>
  
  <!-- Low Value, High Automation (AUTOMATE) -->
  <circle cx="500" cy="290" r="6" fill="#3b82f6"/>
  <text x="512" y="294" class="item">Report Generation</text>
  <circle cx="550" cy="320" r="6" fill="#3b82f6"/>
  <text x="562" y="324" class="item">Data Formatting</text>
  <circle cx="480" cy="350" r="6" fill="#3b82f6"/>
  <text x="492" y="354" class="item">Email Sequences</text>
  <circle cx="600" cy="380" r="6" fill="#3b82f6"/>
  <text x="612" y="384" class="item">Social Posts</text>
</svg>