<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="supportGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#1a1a2e" font-family="Inter, sans-serif" font-size="16" font-weight="700">Book of Work Coverage</text>
  
  <!-- PMM LEADS Section -->
  <rect x="20" y="50" width="370" height="250" rx="8" fill="url(#leadGrad)" stroke="#0070f2" stroke-width="2"/>
  <text x="205" y="75" text-anchor="middle" fill="#0070f2" font-family="Inter, sans-serif" font-size="13" font-weight="700">PMM LEADS (11 Areas)</text>
  
  <!-- Lead items - 2 columns -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#334155">
    <text x="40" y="100">✓ Messaging & Positioning</text>
    <text x="40" y="122">✓ Category Storytelling</text>
    <text x="40" y="144">✓ Market Insights</text>
    <text x="40" y="166">✓ Launch Narrative</text>
    <text x="40" y="188">✓ Adoption Strategy</text>
    <text x="40" y="210">✓ Customer Personas</text>
    
    <text x="210" y="100">✓ Commercialization</text>
    <text x="210" y="122">✓ Launch & Disclosure</text>
    <text x="210" y="144">✓ GTM & Field Readiness</text>
    <text x="210" y="166">✓ Demo</text>
    <text x="210" y="188">✓ Customer Reference</text>
  </g>
  
  <!-- Coverage indicator -->
  <rect x="40" y="240" width="330" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="40" y="240" width="330" height="8" rx="4" fill="#0070f2"/>
  <text x="205" y="268" text-anchor="middle" fill="#0070f2" font-family="Inter, sans-serif" font-size="11" font-weight="600">100% Curriculum Coverage</text>
  
  <!-- PMM SUPPORTS Section -->
  <rect x="410" y="50" width="370" height="250" rx="8" fill="url(#supportGrad)" stroke="#64748b" stroke-width="2"/>
  <text x="595" y="75" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="13" font-weight="700">PMM SUPPORTS (8 Areas)</text>
  
  <!-- Support items - 2 columns -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#475569">
    <text x="430" y="100">✓ Marketing Planning</text>
    <text x="430" y="122">✓ Campaign Execution</text>
    <text x="430" y="144">✓ Press & Communications</text>
    <text x="430" y="166">✓ Partner & ISV</text>
    
    <text x="600" y="100">✓ Pricing Communication</text>
    <text x="600" y="122">✓ Community</text>
    <text x="600" y="144">✓ Learning Journeys</text>
    <text x="600" y="166">✓ Customer Journey Content</text>
  </g>
  
  <!-- Coverage indicator -->
  <rect x="430" y="240" width="330" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="430" y="240" width="330" height="8" rx="4" fill="#64748b"/>
  <text x="595" y="268" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="600">100% Framework Coverage</text>
