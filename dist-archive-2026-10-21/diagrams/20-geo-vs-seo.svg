<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .header { font: bold 12px system-ui, sans-serif; fill: white; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
      .highlight { font: 600 11px system-ui, sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">GEO vs. SEO: What Each Optimizes For</text>
  
  <!-- SEO Column -->
  <rect x="50" y="60" width="330" height="320" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <rect x="50" y="60" width="330" height="45" rx="8" fill="#6b7280"/>
  <text x="215" y="88" text-anchor="middle" class="header">📄 SEO (Traditional)</text>
  
  <text x="70" y="130" class="section-title">Optimizes For:</text>
  <rect x="70" y="140" width="290" height="28" rx="4" fill="#e5e7eb"/>
  <text x="85" y="159" class="item">Human browsers scanning results</text>
  <rect x="70" y="173" width="290" height="28" rx="4" fill="#e5e7eb"/>
  <text x="85" y="192" class="item">Click-through on search pages</text>
  <rect x="70" y="206" width="290" height="28" rx="4" fill="#e5e7eb"/>
  <text x="85" y="225" class="item">Time on page / engagement</text>
  
  <text x="70" y="260" class="section-title">Content That Wins:</text>
  <rect x="70" y="270" width="290" height="24" rx="4" fill="#e5e7eb"/>
  <text x="85" y="287" class="item">• Compelling headlines</text>
  <rect x="70" y="298" width="290" height="24" rx="4" fill="#e5e7eb"/>
  <text x="85" y="315" class="item">• Keyword optimization</text>
  <rect x="70" y="326" width="290" height="24" rx="4" fill="#e5e7eb"/>
  <text x="85" y="343" class="item">• Backlinks and domain authority</text>
  
  <rect x="70" y="358" width="290" height="20" rx="4" fill="#fef3c7"/>
  <text x="215" y="372" text-anchor="middle" class="highlight" fill="#92400e">⚠️ Declining in AI-mediated search</text>
  
  <!-- GEO Column -->
  <rect x="420" y="60" width="330" height="320" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <rect x="420" y="60" width="330" height="45" rx="8" fill="#10b981"/>
  <text x="585" y="88" text-anchor="middle" class="header">🤖 GEO (Generative Engine)</text>
  
  <text x="440" y="130" class="section-title">Optimizes For:</text>
  <rect x="440" y="140" width="290" height="28" rx="4" fill="#dcfce7"/>
  <text x="455" y="159" class="item">AI systems synthesizing answers</text>
  <rect x="440" y="173" width="290" height="28" rx="4" fill="#dcfce7"/>
  <text x="455" y="192" class="item">Inclusion in AI-generated responses</text>
  <rect x="440" y="206" width="290" height="28" rx="4" fill="#dcfce7"/>
  <text x="455" y="225" class="item">Citation as authoritative source</text>
  
  <text x="440" y="260" class="section-title">Content That Wins:</text>
  <rect x="440" y="270" width="290" height="24" rx="4" fill="#dcfce7"/>
  <text x="455" y="287" class="item">• Specific, verifiable claims</text>
  <rect x="440" y="298" width="290" height="24" rx="4" fill="#dcfce7"/>
  <text x="455" y="315" class="item">• Named customers + outcomes</text>
  <rect x="440" y="326" width="290" height="24" rx="4" fill="#dcfce7"/>
  <text x="455" y="343" class="item">• Technical depth + evidence</text>
  
  <rect x="440" y="358" width="290" height="20" rx="4" fill="#d1fae5"/>
  <text x="585" y="372" text-anchor="middle" class="highlight" fill="#047857">✓ Growing importance</text>
</svg>