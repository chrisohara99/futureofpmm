<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .layer-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .tool { font: 600 10px system-ui, sans-serif; fill: #1f2937; }
      .desc { font: 400 10px system-ui, sans-serif; fill: #6b7280; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">PMM Tech Stack Architecture</text>
  <text x="400" y="55" text-anchor="middle" class="label">By team maturity level</text>
  
  <!-- Solo/Small header -->
  <rect x="50" y="75" width="220" height="30" rx="4" fill="#10b981"/>
  <text x="160" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">SOLO / 2-3 PEOPLE</text>
  
  <!-- Mid-size header -->
  <rect x="290" y="75" width="220" height="30" rx="4" fill="#3b82f6"/>
  <text x="400" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">TEAM OF 5-15</text>
  
  <!-- Large header -->
  <rect x="530" y="75" width="220" height="30" rx="4" fill="#8b5cf6"/>
  <text x="640" y="95" text-anchor="middle" fill="white" font-size="12" font-weight="bold">TEAM OF 15+</text>
  
  <!-- Core Layer (all) -->
  <rect x="50" y="120" width="700" height="90" rx="8" fill="#1f2937"/>
  <text x="400" y="145" text-anchor="middle" class="layer-title">🔧 CORE LAYER (Required for all)</text>
  
  <rect x="70" y="155" width="100" height="40" rx="4" fill="#374151"/>
  <text x="120" y="172" text-anchor="middle" fill="#d1d5db" font-size="10" font-weight="600">Claude/GPT</text>
  <text x="120" y="188" text-anchor="middle" fill="#9ca3af" font-size="9">Enterprise tier</text>
  
  <rect x="180" y="155" width="100" height="40" rx="4" fill="#374151"/>
  <text x="230" y="172" text-anchor="middle" fill="#d1d5db" font-size="10" font-weight="600">Perplexity</text>
  <text x="230" y="188" text-anchor="middle" fill="#9ca3af" font-size="9">Research</text>
  
  <rect x="290" y="155" width="100" height="40" rx="4" fill="#374151"/>
  <text x="340" y="172" text-anchor="middle" fill="#d1d5db" font-size="10" font-weight="600">Grammarly</text>
  <text x="340" y="188" text-anchor="middle" fill="#9ca3af" font-size="9">Voice consistency</text>
  
  <text x="550" y="180" text-anchor="middle" fill="#9ca3af" font-size="11">Covers 70-90% of needs</text>
  
  <!-- Specialist Layer (Mid + Large) -->
  <rect x="290" y="225" width="460" height="90" rx="8" fill="#3b82f6"/>
  <text x="520" y="250" text-anchor="middle" class="layer-title">⚙️ SPECIALIST LAYER (5+ team)</text>
  
  <rect x="310" y="260" width="90" height="40" rx="4" fill="#1d4ed8"/>
  <text x="355" y="277" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="600">Klue/Crayon</text>
  <text x="355" y="293" text-anchor="middle" fill="#93c5fd" font-size="9">CI Platform</text>
  
  <rect x="410" y="260" width="90" height="40" rx="4" fill="#1d4ed8"/>
  <text x="455" y="277" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="600">Jasper/Writer</text>
  <text x="455" y="293" text-anchor="middle" fill="#93c5fd" font-size="9">Content Gen</text>
  
  <rect x="510" y="260" width="100" height="40" rx="4" fill="#1d4ed8"/>
  <text x="560" y="277" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="600">Demo Platform</text>
  <text x="560" y="293" text-anchor="middle" fill="#93c5fd" font-size="9">Navattic/Reprise</text>
  
  <rect x="620" y="260" width="80" height="40" rx="4" fill="#1d4ed8"/>
  <text x="660" y="277" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="600">Analytics</text>
  <text x="660" y="293" text-anchor="middle" fill="#93c5fd" font-size="9">Cross-tool</text>
  
  <!-- Custom Layer (Large only) -->
  <rect x="530" y="330" width="220" height="90" rx="8" fill="#8b5cf6"/>
  <text x="640" y="355" text-anchor="middle" class="layer-title">🔬 CUSTOM LAYER (15+)</text>
  
  <rect x="545" y="365" width="90" height="40" rx="4" fill="#7c3aed"/>
  <text x="590" y="382" text-anchor="middle" fill="#ede9fe" font-size="10" font-weight="600">Custom RAG</text>
  <text x="590" y="398" text-anchor="middle" fill="#c4b5fd" font-size="9">Knowledge base</text>
  
  <rect x="645" y="365" width="90" height="40" rx="4" fill="#7c3aed"/>
  <text x="690" y="382" text-anchor="middle" fill="#ede9fe" font-size="10" font-weight="600">Agent Pipes</text>
  <text x="690" y="398" text-anchor="middle" fill="#c4b5fd" font-size="9">LangChain etc.</text>
  
  <!-- Solo focus -->
  <rect x="50" y="225" width="220" height="50" rx="4" fill="#dcfce7" stroke="#10b981"/>
  <text x="160" y="250" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">FOCUS: Master the core</text>
  <text x="160" y="268" text-anchor="middle" class="desc">LLM depth > tool breadth</text>
  
  <!-- Integration warning -->
  <rect x="50" y="360" width="220" height="55" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="160" y="382" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">⚠️ INTEGRATION TAX</text>
  <text x="160" y="400" text-anchor="middle" class="desc">More tools ≠ more output</text>
  <text x="160" y="412" text-anchor="middle" class="desc">Coherence beats coverage</text>
</svg>