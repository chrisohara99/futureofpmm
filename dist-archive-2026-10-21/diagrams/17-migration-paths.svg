<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .path-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .desc { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Pricing Migration Paths</text>
  <text x="400" y="55" text-anchor="middle" class="label">Moving from per-seat to consumption/outcome pricing</text>
  
  <!-- Starting point -->
  <rect x="50" y="160" width="120" height="80" rx="8" fill="#6b7280"/>
  <text x="110" y="195" text-anchor="middle" class="path-title">CURRENT</text>
  <text x="110" y="215" text-anchor="middle" fill="#d1d5db" font-size="11">Per-Seat</text>
  <text x="110" y="230" text-anchor="middle" fill="#d1d5db" font-size="10">Pricing</text>
  
  <!-- Arrow to decision -->
  <line x1="170" y1="200" x2="220" y2="200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr2)"/>
  
  <!-- Decision diamond -->
  <polygon points="280,160 340,200 280,240 220,200" fill="#f59e0b"/>
  <text x="280" y="195" text-anchor="middle" fill="white" font-size="10" font-weight="bold">CHOOSE</text>
  <text x="280" y="210" text-anchor="middle" fill="white" font-size="10" font-weight="bold">PATH</text>
  
  <!-- Path 1: Grandfather -->
  <line x1="310" y1="165" x2="400" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="405" y="65" width="180" height="90" rx="8" fill="#3b82f6"/>
  <text x="495" y="90" text-anchor="middle" class="path-title">🕐 GRANDFATHER</text>
  <text x="495" y="110" text-anchor="middle" fill="#dbeafe" font-size="10">Keep existing pricing</text>
  <text x="495" y="125" text-anchor="middle" fill="#dbeafe" font-size="10">for current customers</text>
  <text x="495" y="140" text-anchor="middle" fill="#93c5fd" font-size="9">2-3 year transition</text>
  
  <rect x="600" y="70" width="150" height="80" rx="4" fill="#dbeafe"/>
  <text x="610" y="88" class="label">TRADE-OFFS</text>
  <text x="610" y="104" class="item">+ Low customer risk</text>
  <text x="610" y="118" class="item">+ Preserves relationships</text>
  <text x="610" y="132" class="item">− Two systems to manage</text>
  <text x="610" y="146" class="item">− Slower transition</text>
  
  <!-- Path 2: Opt-In -->
  <line x1="340" y1="200" x2="400" y2="200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="405" y="165" width="180" height="70" rx="8" fill="#10b981"/>
  <text x="495" y="190" text-anchor="middle" class="path-title">🎁 OPT-IN</text>
  <text x="495" y="210" text-anchor="middle" fill="#d1fae5" font-size="10">Early migration incentives</text>
  <text x="495" y="225" text-anchor="middle" fill="#a7f3d0" font-size="9">Volume discounts, locked rates</text>
  
  <rect x="600" y="160" width="150" height="80" rx="4" fill="#dcfce7"/>
  <text x="610" y="178" class="label">TRADE-OFFS</text>
  <text x="610" y="194" class="item">+ Self-selecting migration</text>
  <text x="610" y="208" class="item">+ Beneficiaries move first</text>
  <text x="610" y="222" class="item">− Complex incentive design</text>
  <text x="610" y="236" class="item">− May leave laggards</text>
  
  <!-- Path 3: Hybrid -->
  <line x1="310" y1="235" x2="400" y2="300" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="405" y="270" width="180" height="70" rx="8" fill="#8b5cf6"/>
  <text x="495" y="295" text-anchor="middle" class="path-title">🔀 HYBRID</text>
  <text x="495" y="315" text-anchor="middle" fill="#ede9fe" font-size="10">Per-seat base + consumption add-ons</text>
  <text x="495" y="330" text-anchor="middle" fill="#c4b5fd" font-size="9">Best of both worlds</text>
  
  <rect x="600" y="265" width="150" height="80" rx="4" fill="#ede9fe"/>
  <text x="610" y="283" class="label">TRADE-OFFS</text>
  <text x="610" y="299" class="item">+ Predictability preserved</text>
  <text x="610" y="313" class="item">+ Growth captured</text>
  <text x="610" y="327" class="item">− Complex to communicate</text>
  <text x="610" y="341" class="item">− May confuse buyers</text>
  
  <!-- Bottom note -->
  <rect x="50" y="350" width="330" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="215" y="372" text-anchor="middle" class="desc">💡 Model customers before choosing — 40%+ cost increase = high churn risk</text>
</svg>