<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .tier-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .cadence { font: bold 12px system-ui, sans-serif; fill: white; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Intelligence Half-Life Framework</text>
  <text x="400" y="55" text-anchor="middle" class="label">Match refresh cadence to decay rate</text>
  
  <!-- Fast Decay -->
  <rect x="60" y="80" width="220" height="280" rx="8" fill="#ef4444"/>
  <text x="170" y="110" text-anchor="middle" class="tier-title">⚡ FAST DECAY</text>
  <rect x="80" y="120" width="180" height="28" rx="4" fill="#fecaca"/>
  <text x="170" y="139" text-anchor="middle" class="cadence" fill="#ef4444">Refresh: Weekly+</text>
  
  <rect x="80" y="160" width="180" height="30" rx="4" fill="#fee2e2"/>
  <text x="90" y="180" class="item">Competitor pricing changes</text>
  
  <rect x="80" y="195" width="180" height="30" rx="4" fill="#fee2e2"/>
  <text x="90" y="215" class="item">Product announcements</text>
  
  <rect x="80" y="230" width="180" height="30" rx="4" fill="#fee2e2"/>
  <text x="90" y="250" class="item">Deal-specific intel from field</text>
  
  <rect x="80" y="265" width="180" height="30" rx="4" fill="#fee2e2"/>
  <text x="90" y="285" class="item">News and analyst coverage</text>
  
  <rect x="80" y="300" width="180" height="30" rx="4" fill="#fee2e2"/>
  <text x="90" y="320" class="item">Social signals</text>
  
  <!-- Decay indicator -->
  <text x="170" y="350" text-anchor="middle" class="label">Days to stale: 7-14</text>
  
  <!-- Medium Decay -->
  <rect x="290" y="80" width="220" height="280" rx="8" fill="#f59e0b"/>
  <text x="400" y="110" text-anchor="middle" class="tier-title">📅 MEDIUM DECAY</text>
  <rect x="310" y="120" width="180" height="28" rx="4" fill="#fef3c7"/>
  <text x="400" y="139" text-anchor="middle" class="cadence" fill="#f59e0b">Refresh: Monthly</text>
  
  <rect x="310" y="160" width="180" height="30" rx="4" fill="#fef9c3"/>
  <text x="320" y="180" class="item">Competitive positioning</text>
  
  <rect x="310" y="195" width="180" height="30" rx="4" fill="#fef9c3"/>
  <text x="320" y="215" class="item">Win/loss patterns</text>
  
  <rect x="310" y="230" width="180" height="30" rx="4" fill="#fef9c3"/>
  <text x="320" y="250" class="item">Customer proof points</text>
  
  <rect x="310" y="265" width="180" height="30" rx="4" fill="#fef9c3"/>
  <text x="320" y="285" class="item">Reference availability</text>
  
  <rect x="310" y="300" width="180" height="30" rx="4" fill="#fef9c3"/>
  <text x="320" y="320" class="item">Market segment dynamics</text>
  
  <!-- Decay indicator -->
  <text x="400" y="350" text-anchor="middle" class="label">Days to stale: 30-45</text>
  
  <!-- Slow Decay -->
  <rect x="520" y="80" width="220" height="280" rx="8" fill="#10b981"/>
  <text x="630" y="110" text-anchor="middle" class="tier-title">🔒 SLOW DECAY</text>
  <rect x="540" y="120" width="180" height="28" rx="4" fill="#d1fae5"/>
  <text x="630" y="139" text-anchor="middle" class="cadence" fill="#10b981">Refresh: Quarterly</text>
  
  <rect x="540" y="160" width="180" height="30" rx="4" fill="#dcfce7"/>
  <text x="550" y="180" class="item">Strategic direction</text>
  
  <rect x="540" y="195" width="180" height="30" rx="4" fill="#dcfce7"/>
  <text x="550" y="215" class="item">Business model analysis</text>
  
  <rect x="540" y="230" width="180" height="30" rx="4" fill="#dcfce7"/>
  <text x="550" y="250" class="item">Technical architecture</text>
  
  <rect x="540" y="265" width="180" height="30" rx="4" fill="#dcfce7"/>
  <text x="550" y="285" class="item">Buyer persona docs</text>
  
  <rect x="540" y="300" width="180" height="30" rx="4" fill="#dcfce7"/>
  <text x="550" y="320" class="item">Industry trend analysis</text>
  
  <!-- Decay indicator -->
  <text x="630" y="350" text-anchor="middle" class="label">Days to stale: 90+</text>
</svg>