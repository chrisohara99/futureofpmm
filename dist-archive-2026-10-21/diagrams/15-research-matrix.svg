<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .header { font: bold 12px system-ui, sans-serif; fill: white; }
      .cell { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .cell-header { font: 600 11px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Primary vs. Secondary Research Matrix</text>
  
  <!-- Table headers -->
  <rect x="50" y="60" width="150" height="40" fill="#1f2937"/>
  <text x="125" y="85" text-anchor="middle" class="header">DIMENSION</text>
  
  <rect x="200" y="60" width="280" height="40" fill="#3b82f6"/>
  <text x="340" y="85" text-anchor="middle" class="header">SECONDARY RESEARCH</text>
  
  <rect x="480" y="60" width="280" height="40" fill="#10b981"/>
  <text x="620" y="85" text-anchor="middle" class="header">PRIMARY RESEARCH</text>
  
  <!-- Row 1: Speed -->
  <rect x="50" y="100" width="150" height="50" fill="#f9fafb"/>
  <text x="125" y="130" text-anchor="middle" class="cell-header">Speed</text>
  
  <rect x="200" y="100" width="280" height="50" fill="#dbeafe"/>
  <text x="340" y="122" text-anchor="middle" class="cell">Minutes to hours</text>
  <text x="340" y="138" text-anchor="middle" class="cell" fill="#6b7280">Agent-accelerated synthesis</text>
  
  <rect x="480" y="100" width="280" height="50" fill="#dcfce7"/>
  <text x="620" y="122" text-anchor="middle" class="cell">Days to weeks</text>
  <text x="620" y="138" text-anchor="middle" class="cell" fill="#6b7280">Scheduling, conducting, analyzing</text>
  
  <!-- Row 2: Depth -->
  <rect x="50" y="150" width="150" height="50" fill="#f3f4f6"/>
  <text x="125" y="180" text-anchor="middle" class="cell-header">Depth</text>
  
  <rect x="200" y="150" width="280" height="50" fill="#eff6ff"/>
  <text x="340" y="172" text-anchor="middle" class="cell">Broad patterns</text>
  <text x="340" y="188" text-anchor="middle" class="cell" fill="#6b7280">Market-level insights</text>
  
  <rect x="480" y="150" width="280" height="50" fill="#f0fdf4"/>
  <text x="620" y="172" text-anchor="middle" class="cell">Deep understanding</text>
  <text x="620" y="188" text-anchor="middle" class="cell" fill="#6b7280">Individual motivations, nuance</text>
  
  <!-- Row 3: Uniqueness -->
  <rect x="50" y="200" width="150" height="50" fill="#f9fafb"/>
  <text x="125" y="230" text-anchor="middle" class="cell-header">Uniqueness</text>
  
  <rect x="200" y="200" width="280" height="50" fill="#dbeafe"/>
  <text x="340" y="222" text-anchor="middle" class="cell">Available to everyone</text>
  <text x="340" y="238" text-anchor="middle" class="cell" fill="#6b7280">No competitive advantage</text>
  
  <rect x="480" y="200" width="280" height="50" fill="#dcfce7"/>
  <text x="620" y="222" text-anchor="middle" class="cell">Proprietary insights</text>
  <text x="620" y="238" text-anchor="middle" class="cell" fill="#6b7280">Only you have this data</text>
  
  <!-- Row 4: Agent Role -->
  <rect x="50" y="250" width="150" height="50" fill="#f3f4f6"/>
  <text x="125" y="280" text-anchor="middle" class="cell-header">Agent Role</text>
  
  <rect x="200" y="250" width="280" height="50" fill="#eff6ff"/>
  <text x="340" y="272" text-anchor="middle" class="cell">High automation</text>
  <text x="340" y="288" text-anchor="middle" class="cell" fill="#6b7280">Gathering, synthesis, reporting</text>
  
  <rect x="480" y="250" width="280" height="50" fill="#f0fdf4"/>
  <text x="620" y="272" text-anchor="middle" class="cell">Augmentation only</text>
  <text x="620" y="288" text-anchor="middle" class="cell" fill="#6b7280">Prep, transcription, analysis assist</text>
  
  <!-- Row 5: Best For -->
  <rect x="50" y="300" width="150" height="50" fill="#f9fafb"/>
  <text x="125" y="330" text-anchor="middle" class="cell-header">Best For</text>
  
  <rect x="200" y="300" width="280" height="50" fill="#dbeafe"/>
  <text x="340" y="322" text-anchor="middle" class="cell">Market sizing, trends,</text>
  <text x="340" y="338" text-anchor="middle" class="cell">competitive landscape</text>
  
  <rect x="480" y="300" width="280" height="50" fill="#dcfce7"/>
  <text x="620" y="322" text-anchor="middle" class="cell">Buyer motivation, unmet needs,</text>
  <text x="620" y="338" text-anchor="middle" class="cell">decision criteria, objections</text>
  
  <!-- Bottom insight -->
  <text x="400" y="370" text-anchor="middle" class="label">💡 Combine both: Secondary for speed + context, Primary for depth + differentiation</text>
</svg>