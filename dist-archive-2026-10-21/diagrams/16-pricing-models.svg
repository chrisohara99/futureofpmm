<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .model-title { font: bold 16px system-ui, sans-serif; fill: white; }
      .section { font: bold 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .pro { font: 400 10px system-ui, sans-serif; fill: #047857; }
      .con { font: 400 10px system-ui, sans-serif; fill: #b91c1c; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Three Pricing Models</text>
  
  <!-- Model 1: Per-Seat -->
  <rect x="40" y="60" width="230" height="370" rx="8" fill="#6b7280"/>
  <text x="155" y="90" text-anchor="middle" class="model-title">💺 PER-SEAT</text>
  <text x="155" y="110" text-anchor="middle" fill="#d1d5db" font-size="11">$X / user / month</text>
  
  <rect x="50" y="125" width="210" height="90" rx="4" fill="#f3f4f6"/>
  <text x="60" y="142" class="section">BEST FOR</text>
  <text x="60" y="158" class="item">• Collaboration tools</text>
  <text x="60" y="172" class="item">• Communication platforms</text>
  <text x="60" y="186" class="item">• Workflow tools</text>
  <text x="60" y="200" class="item">• Value ∝ number of users</text>
  
  <rect x="50" y="220" width="210" height="70" rx="4" fill="#dcfce7"/>
  <text x="60" y="237" class="section">✓ PROS</text>
  <text x="60" y="253" class="pro">• Simple to understand</text>
  <text x="60" y="267" class="pro">• Predictable for buyer</text>
  <text x="60" y="281" class="pro">• Easy to model expansion</text>
  
  <rect x="50" y="295" width="210" height="60" rx="4" fill="#fee2e2"/>
  <text x="60" y="312" class="section">✗ CONS</text>
  <text x="60" y="328" class="con">• AI breaks the model</text>
  <text x="60" y="342" class="con">• Under-monetizes productivity</text>
  
  <rect x="50" y="360" width="210" height="55" rx="4" fill="#4b5563"/>
  <text x="155" y="382" text-anchor="middle" fill="#d1d5db" font-size="10">VALUE ALIGNMENT</text>
  <text x="155" y="402" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">⚠️ Declining</text>
  
  <!-- Model 2: Consumption -->
  <rect x="285" y="60" width="230" height="370" rx="8" fill="#3b82f6"/>
  <text x="400" y="90" text-anchor="middle" class="model-title">📊 CONSUMPTION</text>
  <text x="400" y="110" text-anchor="middle" fill="#dbeafe" font-size="11">Pay for what you use</text>
  
  <rect x="295" y="125" width="210" height="90" rx="4" fill="#dbeafe"/>
  <text x="305" y="142" class="section">BEST FOR</text>
  <text x="305" y="158" class="item">• Data platforms</text>
  <text x="305" y="172" class="item">• API-based services</text>
  <text x="305" y="186" class="item">• Infrastructure products</text>
  <text x="305" y="200" class="item">• Value ∝ usage volume</text>
  
  <rect x="295" y="220" width="210" height="70" rx="4" fill="#dcfce7"/>
  <text x="305" y="237" class="section">✓ PROS</text>
  <text x="305" y="253" class="pro">• Aligns revenue with value</text>
  <text x="305" y="267" class="pro">• Scales with customer</text>
  <text x="305" y="281" class="pro">• Low barrier to start</text>
  
  <rect x="295" y="295" width="210" height="60" rx="4" fill="#fee2e2"/>
  <text x="305" y="312" class="section">✗ CONS</text>
  <text x="305" y="328" class="con">• Unpredictable spend</text>
  <text x="305" y="342" class="con">• Finance teams struggle</text>
  
  <rect x="295" y="360" width="210" height="55" rx="4" fill="#1d4ed8"/>
  <text x="400" y="382" text-anchor="middle" fill="#dbeafe" font-size="10">VALUE ALIGNMENT</text>
  <text x="400" y="402" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">✓ Strong</text>
  
  <!-- Model 3: Outcome -->
  <rect x="530" y="60" width="230" height="370" rx="8" fill="#10b981"/>
  <text x="645" y="90" text-anchor="middle" class="model-title">🎯 OUTCOME</text>
  <text x="645" y="110" text-anchor="middle" fill="#d1fae5" font-size="11">Pay for results / AI credits</text>
  
  <rect x="540" y="125" width="210" height="90" rx="4" fill="#d1fae5"/>
  <text x="550" y="142" class="section">BEST FOR</text>
  <text x="550" y="158" class="item">• AI-native products</text>
  <text x="550" y="172" class="item">• Automation tools</text>
  <text x="550" y="186" class="item">• Agent-powered features</text>
  <text x="550" y="200" class="item">• Value ∝ outcomes delivered</text>
  
  <rect x="540" y="220" width="210" height="70" rx="4" fill="#dcfce7"/>
  <text x="550" y="237" class="section">✓ PROS</text>
  <text x="550" y="253" class="pro">• Perfect value alignment</text>
  <text x="550" y="267" class="pro">• Premium positioning</text>
  <text x="550" y="281" class="pro">• Future-proof model</text>
  
  <rect x="540" y="295" width="210" height="60" rx="4" fill="#fee2e2"/>
  <text x="550" y="312" class="section">✗ CONS</text>
  <text x="550" y="328" class="con">• Hard to define "outcome"</text>
  <text x="550" y="342" class="con">• Requires customer education</text>
  
  <rect x="540" y="360" width="210" height="55" rx="4" fill="#047857"/>
  <text x="645" y="382" text-anchor="middle" fill="#d1fae5" font-size="10">VALUE ALIGNMENT</text>
  <text x="645" y="402" text-anchor="middle" fill="white" font-size="14" font-weight="bold">★ Optimal</text>
</svg>