<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 12px system-ui, sans-serif; fill: #6b7280; }
      .model-label { font: bold 11px system-ui, sans-serif; fill: white; }
      .axis { font: 600 11px system-ui, sans-serif; fill: #9ca3af; }
      .note { font: 400 10px system-ui, sans-serif; fill: #4b5563; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Pricing Value Alignment</text>
  <text x="400" y="55" text-anchor="middle" class="label">Revenue captured vs. value delivered</text>
  
  <!-- Chart area -->
  <rect x="100" y="80" width="600" height="220" fill="#f9fafb" stroke="#e5e7eb"/>
  
  <!-- Y-axis -->
  <line x1="100" y1="80" x2="100" y2="300" stroke="#d1d5db" stroke-width="2"/>
  <text x="50" y="190" text-anchor="middle" class="axis" transform="rotate(-90, 50, 190)">REVENUE CAPTURED →</text>
  
  <!-- X-axis -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#d1d5db" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" class="axis">VALUE DELIVERED →</text>
  
  <!-- Ideal line (diagonal) -->
  <line x1="100" y1="300" x2="700" y2="80" stroke="#10b981" stroke-width="3" stroke-dasharray="8"/>
  <text x="620" y="115" fill="#10b981" font-size="11" font-weight="600">Ideal: 1:1</text>
  
  <!-- Per-Seat line (flat then declining) -->
  <path d="M100 250 L300 220 L500 200 L700 180" stroke="#6b7280" stroke-width="3" fill="none"/>
  <circle cx="700" cy="180" r="25" fill="#6b7280"/>
  <text x="700" y="185" text-anchor="middle" class="model-label">Per-Seat</text>
  
  <!-- Gap indicator for per-seat -->
  <line x1="700" y1="180" x2="700" y2="80" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <rect x="705" y="120" width="60" height="25" rx="3" fill="#fee2e2"/>
  <text x="735" y="137" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">GAP</text>
  
  <!-- Consumption line (closer to ideal) -->
  <path d="M100 290 L300 230 L500 160 L700 100" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <circle cx="600" cy="120" r="25" fill="#3b82f6"/>
  <text x="600" y="125" text-anchor="middle" class="model-label">Consumption</text>
  
  <!-- Outcome line (nearly ideal) -->
  <path d="M100 295 L300 240 L500 150 L680 90" stroke="#10b981" stroke-width="3" fill="none"/>
  <circle cx="500" cy="150" r="25" fill="#10b981"/>
  <text x="500" y="155" text-anchor="middle" class="model-label">Outcome</text>
  
  <!-- The AI problem callout -->
  <rect x="150" y="100" width="200" height="70" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="250" y="120" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">⚠️ THE AI PROBLEM</text>
  <text x="250" y="138" text-anchor="middle" class="note">AI increases value delivered</text>
  <text x="250" y="152" text-anchor="middle" class="note">while reducing user count</text>
  <text x="250" y="166" text-anchor="middle" class="note">→ Per-seat revenue drops</text>
</svg>