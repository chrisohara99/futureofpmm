<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .layer-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .layer-desc { font: 400 12px system-ui, sans-serif; fill: #4b5563; }
      .example { font: italic 11px system-ui, sans-serif; fill: #6b7280; }
      .label { font: 600 11px system-ui, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Three-Layer Positioning Stack</text>
  
  <!-- Layer 1: Capability -->
  <rect x="100" y="70" width="600" height="90" rx="8" fill="#3b82f6"/>
  <text x="130" y="105" class="layer-title">CAPABILITY LAYER</text>
  <text x="130" y="125" fill="#dbeafe" font-size="12">What the product actually does — specific, measurable, verifiable</text>
  <rect x="130" y="135" width="540" height="20" rx="4" fill="#1d4ed8"/>
  <text x="145" y="150" class="example" fill="#93c5fd">"Reduces forecast processing from 14 hours to 90 minutes using real-time ERP data integration"</text>
  
  <!-- Arrow down -->
  <path d="M400 165 L400 180 L385 180 L400 195 L415 180 L400 180" fill="#9ca3af"/>
  
  <!-- Layer 2: Evidence -->
  <rect x="100" y="200" width="600" height="90" rx="8" fill="#10b981"/>
  <text x="130" y="235" class="layer-title">EVIDENCE LAYER</text>
  <text x="130" y="255" fill="#d1fae5" font-size="12">Proof that capabilities deliver outcomes — customer results, benchmarks, third-party validation</text>
  <rect x="130" y="265" width="540" height="20" rx="4" fill="#047857"/>
  <text x="145" y="280" class="example" fill="#a7f3d0">"Fortune 500 automotive manufacturer: 34% reduction in supply chain forecasting errors, $12M annual savings"</text>
  
  <!-- Arrow down -->
  <path d="M400 295 L400 310 L385 310 L400 325 L415 310 L400 310" fill="#9ca3af"/>
  
  <!-- Layer 3: Architecture -->
  <rect x="100" y="330" width="600" height="60" rx="8" fill="#8b5cf6"/>
  <text x="130" y="358" class="layer-title">ARCHITECTURE LAYER</text>
  <text x="130" y="378" fill="#ede9fe" font-size="12">How it works technically — enables verification, explains why capabilities are possible</text>
  
  <!-- Side labels -->
  <text x="720" y="115" class="label" fill="#3b82f6">Agent-readable</text>
  <text x="720" y="130" class="label" fill="#3b82f6">✓ Specific claims</text>
  
  <text x="720" y="245" class="label" fill="#10b981">Agent-verifiable</text>
  <text x="720" y="260" class="label" fill="#10b981">✓ Named customers</text>
  
  <text x="720" y="355" class="label" fill="#8b5cf6">Agent-explainable</text>
  <text x="720" y="370" class="label" fill="#8b5cf6">✓ Technical depth</text>
</svg>