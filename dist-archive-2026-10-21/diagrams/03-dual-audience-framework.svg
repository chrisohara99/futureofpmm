<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 16px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 12px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .highlight { font: 600 11px system-ui, sans-serif; fill: white; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Dual-Audience Framework</text>
  <text x="400" y="55" text-anchor="middle" class="label">Your positioning must work for both audiences</text>
  
  <!-- Left side: Human Buyer -->
  <rect x="50" y="80" width="320" height="340" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="210" cy="120" r="30" fill="#3b82f6"/>
  <text x="210" y="127" text-anchor="middle" fill="white" font-size="24">👤</text>
  <text x="210" y="170" text-anchor="middle" class="section-title">Human Buyer</text>
  
  <!-- Human reads -->
  <text x="70" y="205" class="label">READS:</text>
  <rect x="70" y="215" width="280" height="28" rx="4" fill="#dbeafe"/>
  <text x="85" y="234" class="item">• Marketing website hero messaging</text>
  <rect x="70" y="248" width="280" height="28" rx="4" fill="#dbeafe"/>
  <text x="85" y="267" class="item">• Case studies and social proof</text>
  <rect x="70" y="281" width="280" height="28" rx="4" fill="#dbeafe"/>
  <text x="85" y="300" class="item">• Analyst reports and reviews</text>
  
  <!-- Human evaluates -->
  <text x="70" y="335" class="label">EVALUATES ON:</text>
  <rect x="70" y="345" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="135" y="362" text-anchor="middle" class="highlight">Narrative</text>
  <rect x="210" y="345" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="275" y="362" text-anchor="middle" class="highlight">Trust</text>
  <rect x="70" y="375" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="135" y="392" text-anchor="middle" class="highlight">Emotion</text>
  <rect x="210" y="375" width="130" height="24" rx="4" fill="#3b82f6"/>
  <text x="275" y="392" text-anchor="middle" class="highlight">Relationships</text>
  
  <!-- Right side: AI Agent -->
  <rect x="430" y="80" width="320" height="340" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <circle cx="590" cy="120" r="30" fill="#10b981"/>
  <text x="590" y="127" text-anchor="middle" fill="white" font-size="24">🤖</text>
  <text x="590" y="170" text-anchor="middle" class="section-title">AI Agent</text>
  
  <!-- Agent reads -->
  <text x="450" y="205" class="label">READS:</text>
  <rect x="450" y="215" width="280" height="28" rx="4" fill="#dcfce7"/>
  <text x="465" y="234" class="item">• Full technical documentation</text>
  <rect x="450" y="248" width="280" height="28" rx="4" fill="#dcfce7"/>
  <text x="465" y="267" class="item">• API references and integration guides</text>
  <rect x="450" y="281" width="280" height="28" rx="4" fill="#dcfce7"/>
  <text x="465" y="300" class="item">• Support forums and KB articles</text>
  
  <!-- Agent evaluates -->
  <text x="450" y="335" class="label">EVALUATES ON:</text>
  <rect x="450" y="345" width="130" height="24" rx="4" fill="#10b981"/>
  <text x="515" y="362" text-anchor="middle" class="highlight">Specificity</text>
  <rect x="590" y="345" width="130" height="24" rx="4" fill="#10b981"/>
  <text x="655" y="362" text-anchor="middle" class="highlight">Evidence</text>
  <rect x="450" y="375" width="130" height="24" rx="4" fill="#10b981"/>
  <text x="515" y="392" text-anchor="middle" class="highlight">Consistency</text>
  <rect x="590" y="375" width="130" height="24" rx="4" fill="#10b981"/>
  <text x="655" y="392" text-anchor="middle" class="highlight">Verifiability</text>
  
  <!-- Center divider with "vs" -->
  <line x1="400" y1="100" x2="400" y2="400" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6"/>
  <circle cx="400" cy="250" r="20" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">VS</text>
</svg>