<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .tier-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .model { font: bold 11px system-ui, sans-serif; fill: #1f2937; }
      .task { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Model Selection Matrix</text>
  <text x="400" y="55" text-anchor="middle" class="label">Match model capability to task complexity</text>
  
  <!-- Tier 1: Fast/Cheap -->
  <rect x="50" y="80" width="220" height="280" rx="8" fill="#10b981"/>
  <text x="160" y="110" text-anchor="middle" class="tier-title">⚡ TIER 1</text>
  <text x="160" y="130" text-anchor="middle" fill="#d1fae5" font-size="12">Fast + Cheap</text>
  
  <rect x="65" y="145" width="190" height="40" rx="4" fill="#dcfce7"/>
  <text x="160" y="165" text-anchor="middle" class="model">Claude Haiku / GPT-4o Mini</text>
  <text x="160" y="180" text-anchor="middle" class="label">~$0.25/M tokens</text>
  
  <rect x="65" y="195" width="190" height="150" rx="4" fill="#f0fdf4"/>
  <text x="75" y="215" class="label">BEST FOR:</text>
  <text x="75" y="235" class="task">• Simple formatting</text>
  <text x="75" y="252" class="task">• Data extraction</text>
  <text x="75" y="269" class="task">• Translation</text>
  <text x="75" y="286" class="task">• Basic summarization</text>
  <text x="75" y="303" class="task">• Template filling</text>
  <text x="75" y="320" class="task">• FAQ responses</text>
  <text x="75" y="337" class="task" fill="#6b7280" font-style="italic">Errors are easily caught</text>
  
  <!-- Tier 2: Standard -->
  <rect x="290" y="80" width="220" height="280" rx="8" fill="#3b82f6"/>
  <text x="400" y="110" text-anchor="middle" class="tier-title">⚙️ TIER 2</text>
  <text x="400" y="130" text-anchor="middle" fill="#dbeafe" font-size="12">Balanced</text>
  
  <rect x="305" y="145" width="190" height="40" rx="4" fill="#dbeafe"/>
  <text x="400" y="165" text-anchor="middle" class="model">Claude Sonnet / GPT-4o</text>
  <text x="400" y="180" text-anchor="middle" class="label">~$3-5/M tokens</text>
  
  <rect x="305" y="195" width="190" height="150" rx="4" fill="#eff6ff"/>
  <text x="315" y="215" class="label">BEST FOR:</text>
  <text x="315" y="235" class="task">• Content drafting</text>
  <text x="315" y="252" class="task">• Competitive analysis</text>
  <text x="315" y="269" class="task">• Research synthesis</text>
  <text x="315" y="286" class="task">• Email sequences</text>
  <text x="315" y="303" class="task">• Standard Q&amp;A</text>
  <text x="315" y="320" class="task">• Most daily PMM work</text>
  <text x="315" y="337" class="task" fill="#6b7280" font-style="italic">Good balance of quality/cost</text>
  
  <!-- Tier 3: Premium -->
  <rect x="530" y="80" width="220" height="280" rx="8" fill="#8b5cf6"/>
  <text x="640" y="110" text-anchor="middle" class="tier-title">🎯 TIER 3</text>
  <text x="640" y="130" text-anchor="middle" fill="#ede9fe" font-size="12">Maximum Capability</text>
  
  <rect x="545" y="145" width="190" height="40" rx="4" fill="#ede9fe"/>
  <text x="640" y="165" text-anchor="middle" class="model">Claude Opus / GPT-4</text>
  <text x="640" y="180" text-anchor="middle" class="label">~$15-75/M tokens</text>
  
  <rect x="545" y="195" width="190" height="150" rx="4" fill="#faf5ff"/>
  <text x="555" y="215" class="label">BEST FOR:</text>
  <text x="555" y="235" class="task">• Complex reasoning</text>
  <text x="555" y="252" class="task">• Subtle positioning work</text>
  <text x="555" y="269" class="task">• Multi-step analysis</text>
  <text x="555" y="286" class="task">• High-stakes content</text>
  <text x="555" y="303" class="task">• Deep domain nuance</text>
  <text x="555" y="320" class="task">• Strategic planning</text>
  <text x="555" y="337" class="task" fill="#6b7280" font-style="italic">Quality worth the cost</text>
</svg>