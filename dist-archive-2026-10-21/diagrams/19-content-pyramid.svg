<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .layer-title { font: bold 16px system-ui, sans-serif; fill: white; }
      .percent { font: bold 24px system-ui, sans-serif; fill: white; }
      .desc { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Three-Layer Content Model</text>
  <text x="400" y="55" text-anchor="middle" class="label">Invert the traditional time allocation</text>
  
  <!-- Pyramid -->
  <!-- Top: Signature -->
  <polygon points="400,80 500,200 300,200" fill="#8b5cf6"/>
  <text x="400" y="140" text-anchor="middle" class="layer-title">SIGNATURE</text>
  <text x="400" y="165" text-anchor="middle" fill="#ede9fe" font-size="12">40% of time</text>
  <text x="400" y="185" text-anchor="middle" fill="#c4b5fd" font-size="10">20% of output</text>
  
  <!-- Middle: Strategic -->
  <polygon points="300,205 500,205 570,310 230,310" fill="#3b82f6"/>
  <text x="400" y="245" text-anchor="middle" class="layer-title">STRATEGIC</text>
  <text x="400" y="270" text-anchor="middle" fill="#dbeafe" font-size="12">40% of time</text>
  <text x="400" y="290" text-anchor="middle" fill="#93c5fd" font-size="10">40% of output</text>
  
  <!-- Bottom: Commodity -->
  <polygon points="230,315 570,315 650,420 150,420" fill="#10b981"/>
  <text x="400" y="355" text-anchor="middle" class="layer-title">COMMODITY</text>
  <text x="400" y="380" text-anchor="middle" fill="#d1fae5" font-size="12">20% of time</text>
  <text x="400" y="400" text-anchor="middle" fill="#a7f3d0" font-size="10">40% of output</text>
  
  <!-- Right side descriptions -->
  <rect x="560" y="100" width="200" height="80" rx="4" fill="#ede9fe"/>
  <text x="570" y="120" class="label" fill="#7c3aed">SIGNATURE CONTENT</text>
  <text x="570" y="138" class="item">• Personal experience required</text>
  <text x="570" y="152" class="item">• Irreplaceable human voice</text>
  <text x="570" y="166" class="item">• Keynotes, essays, frameworks</text>
  
  <rect x="590" y="215" width="180" height="80" rx="4" fill="#dbeafe"/>
  <text x="600" y="235" class="label" fill="#1d4ed8">STRATEGIC CONTENT</text>
  <text x="600" y="253" class="item">• Human-directed, agent-assisted</text>
  <text x="600" y="267" class="item">• GEO-optimized pieces</text>
  <text x="600" y="281" class="item">• Competitive positioning</text>
  
  <rect x="620" y="340" width="160" height="70" rx="4" fill="#dcfce7"/>
  <text x="630" y="358" class="label" fill="#047857">COMMODITY CONTENT</text>
  <text x="630" y="376" class="item">• Agent-produced, human-reviewed</text>
  <text x="630" y="390" class="item">• Blog posts, social, emails</text>
  
  <!-- Left side: Human involvement -->
  <rect x="40" y="100" width="150" height="60" rx="4" fill="#f3f4f6"/>
  <text x="115" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">100% Human</text>
  <text x="115" y="145" text-anchor="middle" class="desc">No agent drafting</text>
  
  <rect x="40" y="220" width="150" height="60" rx="4" fill="#f3f4f6"/>
  <text x="115" y="245" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Human + Agent</text>
  <text x="115" y="265" text-anchor="middle" class="desc">Directed workflow</text>
  
  <rect x="40" y="350" width="150" height="50" rx="4" fill="#f3f4f6"/>
  <text x="115" y="375" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Agent + Review</text>
  <text x="115" y="392" text-anchor="middle" class="desc">Approve &amp; publish</text>
</svg>