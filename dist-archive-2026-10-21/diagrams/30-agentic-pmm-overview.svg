<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font: bold 22px system-ui, sans-serif; fill: #1f2937; }
      .section { font: bold 12px system-ui, sans-serif; fill: white; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
      .unit { font: 600 9px system-ui, sans-serif; fill: white; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Agentic PMM Framework</text>
  <text x="400" y="55" text-anchor="middle" class="label">A complete system for product marketing in the AI era</text>
  
  <!-- Center: Human -->
  <circle cx="400" cy="260" r="70" fill="#1f2937"/>
  <text x="400" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold">THE PMM</text>
  <text x="400" y="270" text-anchor="middle" fill="#9ca3af" font-size="11">Judgment · Strategy</text>
  <text x="400" y="285" text-anchor="middle" fill="#9ca3af" font-size="11">Relationships · Craft</text>
  
  <!-- Top: Foundations -->
  <rect x="300" y="75" width="200" height="55" rx="8" fill="#6b7280"/>
  <text x="400" y="100" text-anchor="middle" class="section">📚 FOUNDATIONS</text>
  <rect x="315" y="110" width="80" height="16" rx="3" fill="#4b5563"/>
  <text x="355" y="121" text-anchor="middle" class="unit">Unit 1-2</text>
  <text x="400" y="125" text-anchor="middle" fill="#d1d5db" font-size="9">Positioning · Messaging</text>
  
  <!-- Top-Left: Intelligence -->
  <rect x="80" y="120" width="160" height="80" rx="8" fill="#3b82f6"/>
  <text x="160" y="145" text-anchor="middle" class="section">🔍 INTELLIGENCE</text>
  <rect x="95" y="155" width="40" height="14" rx="3" fill="#1d4ed8"/>
  <text x="115" y="165" text-anchor="middle" class="unit">U3</text>
  <rect x="140" y="155" width="40" height="14" rx="3" fill="#1d4ed8"/>
  <text x="160" y="165" text-anchor="middle" class="unit">U4</text>
  <rect x="185" y="155" width="40" height="14" rx="3" fill="#1d4ed8"/>
  <text x="205" y="165" text-anchor="middle" class="unit">U7</text>
  <text x="160" y="190" text-anchor="middle" fill="#dbeafe" font-size="9">CI · Analysts · Research</text>
  
  <!-- Top-Right: Enablement -->
  <rect x="560" y="120" width="160" height="80" rx="8" fill="#10b981"/>
  <text x="640" y="145" text-anchor="middle" class="section">🎯 ENABLEMENT</text>
  <rect x="590" y="155" width="40" height="14" rx="3" fill="#047857"/>
  <text x="610" y="165" text-anchor="middle" class="unit">U5</text>
  <rect x="635" y="155" width="40" height="14" rx="3" fill="#047857"/>
  <text x="655" y="165" text-anchor="middle" class="unit">U6</text>
  <text x="640" y="190" text-anchor="middle" fill="#d1fae5" font-size="9">Sales Tools · Launches</text>
  
  <!-- Left: Pricing & Content -->
  <rect x="80" y="230" width="160" height="60" rx="8" fill="#8b5cf6"/>
  <text x="160" y="255" text-anchor="middle" class="section">💰 PRICING</text>
  <rect x="135" y="265" width="50" height="14" rx="3" fill="#7c3aed"/>
  <text x="160" y="275" text-anchor="middle" class="unit">Unit 8</text>
  
  <!-- Right: Content -->
  <rect x="560" y="230" width="160" height="60" rx="8" fill="#f59e0b"/>
  <text x="640" y="255" text-anchor="middle" class="section">✍️ CONTENT</text>
  <rect x="615" y="265" width="50" height="14" rx="3" fill="#d97706"/>
  <text x="640" y="275" text-anchor="middle" class="unit">Unit 9</text>
  
  <!-- Bottom-Left: Demand Gen -->
  <rect x="80" y="320" width="160" height="60" rx="8" fill="#ef4444"/>
  <text x="160" y="345" text-anchor="middle" class="section">📈 DEMAND GEN</text>
  <rect x="130" y="355" width="60" height="14" rx="3" fill="#b91c1c"/>
  <text x="160" y="365" text-anchor="middle" class="unit">Unit 10</text>
  
  <!-- Bottom-Right: Tools -->
  <rect x="560" y="320" width="160" height="60" rx="8" fill="#06b6d4"/>
  <text x="640" y="345" text-anchor="middle" class="section">🔧 AI TOOLS</text>
  <rect x="610" y="355" width="60" height="14" rx="3" fill="#0891b2"/>
  <text x="640" y="365" text-anchor="middle" class="unit">Unit 11</text>
  
  <!-- Bottom: Capstone -->
  <rect x="300" y="405" width="200" height="55" rx="8" fill="#1f2937"/>
  <text x="400" y="430" text-anchor="middle" class="section">🎓 CAPSTONE</text>
  <rect x="360" y="440" width="80" height="14" rx="3" fill="#374151"/>
  <text x="400" y="450" text-anchor="middle" class="unit">Unit 12</text>
  
  <!-- Connection lines -->
  <line x1="400" y1="130" x2="400" y2="190" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="240" y1="160" x2="330" y2="210" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="560" y1="160" x2="470" y2="210" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="240" y1="260" x2="330" y2="260" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="560" y1="260" x2="470" y2="260" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="240" y1="350" x2="330" y2="300" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="560" y1="350" x2="470" y2="300" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="400" y1="330" x2="400" y2="405" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="400" y="485" text-anchor="middle" class="label">Agents handle production · Humans provide judgment</text>
</svg>