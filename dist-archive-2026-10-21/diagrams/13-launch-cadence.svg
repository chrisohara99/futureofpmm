<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Launch Cadence Evolution</text>
  
  <!-- OLD: Big Bang Model -->
  <rect x="50" y="60" width="700" height="120" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="90" class="section-title">❌ OLD: Big-Bang Launch Model</text>
  
  <!-- Timeline -->
  <line x1="100" y1="130" x2="700" y2="130" stroke="#fca5a5" stroke-width="4"/>
  
  <!-- Big launches -->
  <circle cx="180" cy="130" r="25" fill="#ef4444"/>
  <text x="180" y="135" text-anchor="middle" fill="white" font-weight="bold" font-size="10">Q1</text>
  <text x="180" y="170" text-anchor="middle" class="label">Major</text>
  
  <circle cx="380" cy="130" r="25" fill="#ef4444"/>
  <text x="380" y="135" text-anchor="middle" fill="white" font-weight="bold" font-size="10">Q2</text>
  <text x="380" y="170" text-anchor="middle" class="label">Major</text>
  
  <circle cx="580" cy="130" r="25" fill="#ef4444"/>
  <text x="580" y="135" text-anchor="middle" fill="white" font-weight="bold" font-size="10">Q3</text>
  <text x="580" y="170" text-anchor="middle" class="label">Major</text>
  
  <!-- Flat lines between -->
  <text x="280" y="115" text-anchor="middle" class="item" fill="#9ca3af">silence...</text>
  <text x="480" y="115" text-anchor="middle" class="item" fill="#9ca3af">silence...</text>
  <text x="660" y="115" text-anchor="middle" class="item" fill="#9ca3af">...</text>
  
  <!-- NEW: Always-On Model -->
  <rect x="50" y="195" width="700" height="140" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="80" y="225" class="section-title">✅ NEW: Always-On Drumbeat</text>
  
  <!-- Timeline -->
  <line x1="100" y1="280" x2="700" y2="280" stroke="#86efac" stroke-width="4"/>
  
  <!-- Continuous small beats -->
  <circle cx="130" cy="280" r="8" fill="#10b981"/>
  <circle cx="170" cy="280" r="8" fill="#10b981"/>
  <circle cx="210" cy="280" r="8" fill="#10b981"/>
  <circle cx="250" cy="280" r="15" fill="#047857"/>
  <circle cx="290" cy="280" r="8" fill="#10b981"/>
  <circle cx="330" cy="280" r="8" fill="#10b981"/>
  <circle cx="370" cy="280" r="8" fill="#10b981"/>
  <circle cx="410" cy="280" r="20" fill="#047857"/>
  <circle cx="450" cy="280" r="8" fill="#10b981"/>
  <circle cx="490" cy="280" r="8" fill="#10b981"/>
  <circle cx="530" cy="280" r="8" fill="#10b981"/>
  <circle cx="570" cy="280" r="12" fill="#047857"/>
  <circle cx="610" cy="280" r="8" fill="#10b981"/>
  <circle cx="650" cy="280" r="8" fill="#10b981"/>
  <circle cx="690" cy="280" r="8" fill="#10b981"/>
  
  <!-- Legend -->
  <circle cx="130" cy="320" r="6" fill="#10b981"/>
  <text x="145" y="324" class="item">Weekly updates</text>
  
  <circle cx="280" cy="320" r="10" fill="#047857"/>
  <text x="298" y="324" class="item">Feature launches</text>
  
  <circle cx="450" cy="320" r="14" fill="#047857"/>
  <text x="472" y="324" class="item">Major releases</text>
  
  <!-- Comparison callout -->
  <rect x="550" y="200" width="180" height="60" rx="4" fill="#f0fdf4" stroke="#10b981"/>
  <text x="640" y="222" text-anchor="middle" class="label">RESULT</text>
  <text x="640" y="240" text-anchor="middle" class="item">Continuous engagement</text>
  <text x="640" y="255" text-anchor="middle" class="item">No "dead" periods</text>
</svg>