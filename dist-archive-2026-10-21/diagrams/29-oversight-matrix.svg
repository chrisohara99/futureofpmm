<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .level-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
      .review { font: 600 11px system-ui, sans-serif; fill: white; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Human-in-the-Loop Oversight Matrix</text>
  <text x="400" y="55" text-anchor="middle" class="label">Match oversight level to blast radius</text>
  
  <!-- Risk scale -->
  <rect x="50" y="80" width="700" height="30" fill="url(#riskGradient)"/>
  <defs>
    <linearGradient id="riskGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <text x="100" y="100" fill="white" font-size="10" font-weight="bold">LOW RISK</text>
  <text x="700" y="100" text-anchor="end" fill="white" font-size="10" font-weight="bold">HIGH RISK</text>
  
  <!-- Low Stakes -->
  <rect x="50" y="130" width="220" height="220" rx="8" fill="#10b981"/>
  <text x="160" y="160" text-anchor="middle" class="level-title">✅ LOW STAKES</text>
  
  <rect x="65" y="175" width="190" height="25" rx="4" fill="#047857"/>
  <text x="160" y="192" text-anchor="middle" class="review">MINIMAL REVIEW</text>
  
  <rect x="65" y="210" width="190" height="120" rx="4" fill="#dcfce7"/>
  <text x="75" y="230" class="label">EXAMPLES:</text>
  <text x="75" y="250" class="item">• Internal summaries</text>
  <text x="75" y="267" class="item">• Research synthesis</text>
  <text x="75" y="284" class="item">• First drafts for editing</text>
  <text x="75" y="301" class="item">• Personal brainstorming</text>
  <text x="75" y="318" class="item" fill="#6b7280" font-style="italic">If wrong → revision cycle</text>
  
  <!-- Medium Stakes -->
  <rect x="290" y="130" width="220" height="220" rx="8" fill="#f59e0b"/>
  <text x="400" y="160" text-anchor="middle" class="level-title">⚠️ MEDIUM STAKES</text>
  
  <rect x="305" y="175" width="190" height="25" rx="4" fill="#d97706"/>
  <text x="400" y="192" text-anchor="middle" class="review">SPOT CHECK REVIEW</text>
  
  <rect x="305" y="210" width="190" height="120" rx="4" fill="#fef3c7"/>
  <text x="315" y="230" class="label">EXAMPLES:</text>
  <text x="315" y="250" class="item">• Blog posts</text>
  <text x="315" y="267" class="item">• Social content</text>
  <text x="315" y="284" class="item">• Competitive updates</text>
  <text x="315" y="301" class="item">• Customer-facing emails</text>
  <text x="315" y="318" class="item" fill="#92400e" font-style="italic">If wrong → embarrassment</text>
  
  <!-- High Stakes -->
  <rect x="530" y="130" width="220" height="220" rx="8" fill="#ef4444"/>
  <text x="640" y="160" text-anchor="middle" class="level-title">🚨 HIGH STAKES</text>
  
  <rect x="545" y="175" width="190" height="25" rx="4" fill="#b91c1c"/>
  <text x="640" y="192" text-anchor="middle" class="review">FULL REVIEW (2+ PEOPLE)</text>
  
  <rect x="545" y="210" width="190" height="120" rx="4" fill="#fee2e2"/>
  <text x="555" y="230" class="label">EXAMPLES:</text>
  <text x="555" y="250" class="item">• Pricing communications</text>
  <text x="555" y="267" class="item">• Analyst briefings</text>
  <text x="555" y="284" class="item">• Contract language</text>
  <text x="555" y="301" class="item">• Roadmap content</text>
  <text x="555" y="318" class="item" fill="#b91c1c" font-style="italic">If wrong → real damage</text>
  
  <!-- Bottom insight -->
  <rect x="200" y="358" width="400" height="25" rx="4" fill="#f3f4f6"/>
  <text x="400" y="375" text-anchor="middle" class="label">💡 Uniform oversight = efficiency loss OR quality problems</text>
</svg>