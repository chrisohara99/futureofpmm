<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #4b5563; }
      .time { font: bold 12px system-ui, sans-serif; fill: white; }
      .step { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">CI Speed Advantage: Traditional vs. Agent-Powered</text>
  
  <!-- Traditional Timeline -->
  <text x="80" y="80" class="section-title">❌ Traditional CI Workflow</text>
  <rect x="80" y="95" width="640" height="50" rx="4" fill="#fee2e2"/>
  
  <!-- Traditional steps -->
  <rect x="90" y="105" width="80" height="30" rx="4" fill="#ef4444"/>
  <text x="130" y="125" text-anchor="middle" class="time">2-4 hrs</text>
  <text x="130" y="152" text-anchor="middle" class="step">Gather signals</text>
  
  <rect x="180" y="105" width="100" height="30" rx="4" fill="#ef4444"/>
  <text x="230" y="125" text-anchor="middle" class="time">4-8 hrs</text>
  <text x="230" y="152" text-anchor="middle" class="step">Read &amp; analyze</text>
  
  <rect x="290" y="105" width="100" height="30" rx="4" fill="#ef4444"/>
  <text x="340" y="125" text-anchor="middle" class="time">2-4 hrs</text>
  <text x="340" y="152" text-anchor="middle" class="step">Write synthesis</text>
  
  <rect x="400" y="105" width="80" height="30" rx="4" fill="#ef4444"/>
  <text x="440" y="125" text-anchor="middle" class="time">1-2 hrs</text>
  <text x="440" y="152" text-anchor="middle" class="step">Review</text>
  
  <rect x="490" y="105" width="80" height="30" rx="4" fill="#ef4444"/>
  <text x="530" y="125" text-anchor="middle" class="time">1 hr</text>
  <text x="530" y="152" text-anchor="middle" class="step">Distribute</text>
  
  <rect x="580" y="105" width="130" height="30" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
  <text x="645" y="125" text-anchor="middle" class="time">10-20 hrs total</text>
  
  <!-- Agent Timeline -->
  <text x="80" y="210" class="section-title">✅ Agent-Powered CI Workflow</text>
  <rect x="80" y="225" width="640" height="50" rx="4" fill="#dcfce7"/>
  
  <!-- Agent steps -->
  <rect x="90" y="235" width="60" height="30" rx="4" fill="#10b981"/>
  <text x="120" y="255" text-anchor="middle" class="time">Auto</text>
  <text x="120" y="282" text-anchor="middle" class="step">Ingest</text>
  
  <rect x="160" y="235" width="80" height="30" rx="4" fill="#10b981"/>
  <text x="200" y="255" text-anchor="middle" class="time">5 min</text>
  <text x="200" y="282" text-anchor="middle" class="step">LLM synthesis</text>
  
  <rect x="250" y="235" width="80" height="30" rx="4" fill="#10b981"/>
  <text x="290" y="255" text-anchor="middle" class="time">15 min</text>
  <text x="290" y="282" text-anchor="middle" class="step">Human review</text>
  
  <rect x="340" y="235" width="60" height="30" rx="4" fill="#10b981"/>
  <text x="370" y="255" text-anchor="middle" class="time">Auto</text>
  <text x="370" y="282" text-anchor="middle" class="step">Distribute</text>
  
  <rect x="410" y="235" width="100" height="30" rx="4" fill="#047857" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="255" text-anchor="middle" class="time">~20 min total</text>
  
  <!-- Comparison -->
  <rect x="550" y="220" width="170" height="70" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="635" y="245" text-anchor="middle" font-size="24" font-weight="bold" fill="#10b981">30-60x</text>
  <text x="635" y="265" text-anchor="middle" class="label">faster intelligence</text>
  <text x="635" y="280" text-anchor="middle" class="step">Human shifts to judgment</text>
</svg>