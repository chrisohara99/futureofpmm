<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .skill-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .desc { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
      .item { font: 400 10px system-ui, sans-serif; fill: #1f2937; }
      .center { font: bold 16px system-ui, sans-serif; fill: white; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Four Surviving PMM Skills</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6b7280">What agents can't replace</text>
  
  <!-- Center circle -->
  <circle cx="400" cy="240" r="65" fill="#1f2937"/>
  <text x="400" y="230" text-anchor="middle" class="center">HUMAN</text>
  <text x="400" y="250" text-anchor="middle" class="center">EDGE</text>
  <text x="400" y="270" text-anchor="middle" fill="#9ca3af" font-size="10">Irreplaceable</text>
  
  <!-- Skill 1: Strategic Judgment (top) -->
  <rect x="280" y="70" width="240" height="90" rx="8" fill="#8b5cf6"/>
  <text x="400" y="100" text-anchor="middle" class="skill-title">🎯 STRATEGIC JUDGMENT</text>
  <text x="400" y="120" text-anchor="middle" fill="#ede9fe" font-size="11">Deciding when data is inconclusive</text>
  <rect x="295" y="130" width="210" height="22" rx="3" fill="#ede9fe"/>
  <text x="400" y="146" text-anchor="middle" class="item">Pricing model trade-offs</text>
  
  <line x1="400" y1="165" x2="400" y2="175" stroke="#8b5cf6" stroke-width="3"/>
  
  <!-- Skill 2: Organizational Intelligence (left) -->
  <rect x="80" y="175" width="200" height="130" rx="8" fill="#3b82f6"/>
  <text x="180" y="205" text-anchor="middle" class="skill-title">🏢 ORGANIZATIONAL</text>
  <text x="180" y="222" text-anchor="middle" class="skill-title">INTELLIGENCE</text>
  <text x="180" y="245" text-anchor="middle" fill="#dbeafe" font-size="10">Reading power dynamics</text>
  <rect x="95" y="255" width="170" height="22" rx="3" fill="#dbeafe"/>
  <text x="180" y="270" text-anchor="middle" class="item">Stakeholder navigation</text>
  <rect x="95" y="280" width="170" height="18" rx="3" fill="#dbeafe"/>
  <text x="180" y="293" text-anchor="middle" class="item" font-size="9">Who really makes decisions</text>
  
  <line x1="280" y1="240" x2="335" y2="240" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Skill 3: Narrative Craft (right) -->
  <rect x="520" y="175" width="200" height="130" rx="8" fill="#10b981"/>
  <text x="620" y="205" text-anchor="middle" class="skill-title">✍️ NARRATIVE</text>
  <text x="620" y="222" text-anchor="middle" class="skill-title">CRAFT</text>
  <text x="620" y="245" text-anchor="middle" fill="#d1fae5" font-size="10">Stories only you can tell</text>
  <rect x="535" y="255" width="170" height="22" rx="3" fill="#d1fae5"/>
  <text x="620" y="270" text-anchor="middle" class="item">Lived experience</text>
  <rect x="535" y="280" width="170" height="18" rx="3" fill="#d1fae5"/>
  <text x="620" y="293" text-anchor="middle" class="item" font-size="9">Named characters + context</text>
  
  <line x1="465" y1="240" x2="520" y2="240" stroke="#10b981" stroke-width="3"/>
  
  <!-- Skill 4: Relationship Building (bottom) -->
  <rect x="280" y="320" width="240" height="90" rx="8" fill="#f59e0b"/>
  <text x="400" y="350" text-anchor="middle" class="skill-title">🤝 RELATIONSHIP BUILDING</text>
  <text x="400" y="370" text-anchor="middle" fill="#fef3c7" font-size="11">Trust that takes time to earn</text>
  <rect x="295" y="380" width="210" height="22" rx="3" fill="#fef3c7"/>
  <text x="400" y="396" text-anchor="middle" class="item">Analyst, customer, exec relationships</text>
  
  <line x1="400" y1="305" x2="400" y2="320" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- Note -->
  <text x="400" y="435" text-anchor="middle" class="desc">💡 Focus development time here — these skills compound over a career</text>
</svg>