<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .layer-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .arrow-label { font: 600 10px system-ui, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Competitive Intelligence Architecture</text>
  
  <!-- Layer 1: Data Ingestion -->
  <rect x="50" y="70" width="700" height="80" rx="8" fill="#f59e0b"/>
  <text x="80" y="95" class="layer-title">DATA INGESTION LAYER</text>
  
  <!-- Ingestion sources -->
  <rect x="80" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="125" y="127" text-anchor="middle" class="item">RSS Feeds</text>
  <rect x="180" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="225" y="127" text-anchor="middle" class="item">Earnings Calls</text>
  <rect x="280" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="325" y="127" text-anchor="middle" class="item">Analyst Reports</text>
  <rect x="380" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="425" y="127" text-anchor="middle" class="item">Social Feeds</text>
  <rect x="480" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="525" y="127" text-anchor="middle" class="item">Doc Changes</text>
  <rect x="580" y="105" width="90" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="127" text-anchor="middle" class="item">Price Monitors</text>
  
  <!-- Arrow -->
  <line x1="400" y1="155" x2="400" y2="185" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="175" class="arrow-label">Raw signals</text>
  
  <!-- Layer 2: Processing -->
  <rect x="50" y="190" width="700" height="80" rx="8" fill="#3b82f6"/>
  <text x="80" y="215" class="layer-title">PROCESSING LAYER</text>
  <text x="80" y="235" fill="#dbeafe" font-size="11">LLM categorizes by: Competitor | Topic | Significance</text>
  
  <rect x="80" y="245" width="100" height="20" rx="4" fill="#1d4ed8"/>
  <text x="130" y="259" text-anchor="middle" fill="#93c5fd" font-size="10">Pricing</text>
  <rect x="190" y="245" width="100" height="20" rx="4" fill="#1d4ed8"/>
  <text x="240" y="259" text-anchor="middle" fill="#93c5fd" font-size="10">Positioning</text>
  <rect x="300" y="245" width="100" height="20" rx="4" fill="#1d4ed8"/>
  <text x="350" y="259" text-anchor="middle" fill="#93c5fd" font-size="10">Product</text>
  <rect x="410" y="245" width="100" height="20" rx="4" fill="#1d4ed8"/>
  <text x="460" y="259" text-anchor="middle" fill="#93c5fd" font-size="10">People</text>
  <rect x="520" y="245" width="100" height="20" rx="4" fill="#1d4ed8"/>
  <text x="570" y="259" text-anchor="middle" fill="#93c5fd" font-size="10">Partnerships</text>
  
  <!-- Arrow -->
  <line x1="400" y1="275" x2="400" y2="305" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="295" class="arrow-label">Structured intel</text>
  
  <!-- Layer 3: Synthesis -->
  <rect x="50" y="310" width="700" height="70" rx="8" fill="#10b981"/>
  <text x="80" y="335" class="layer-title">SYNTHESIS LAYER</text>
  <text x="80" y="355" fill="#d1fae5" font-size="11">Pattern recognition: Compare today's signals vs. competitive baseline → Identify meaningful shifts</text>
  <text x="80" y="370" fill="#a7f3d0" font-size="10" font-style="italic">"Pricing change + positioning shift + analyst comment = strategic pivot detected"</text>
  
  <!-- Arrow -->
  <line x1="400" y1="385" x2="400" y2="415" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="405" class="arrow-label">Insights</text>
  
  <!-- Layer 4: Output -->
  <rect x="50" y="420" width="700" height="60" rx="8" fill="#8b5cf6"/>
  <text x="80" y="445" class="layer-title">OUTPUT LAYER</text>
  
  <rect x="80" y="455" width="110" height="20" rx="4" fill="#7c3aed"/>
  <text x="135" y="469" text-anchor="middle" fill="#ede9fe" font-size="10">🔔 Slack Alerts</text>
  <rect x="200" y="455" width="110" height="20" rx="4" fill="#7c3aed"/>
  <text x="255" y="469" text-anchor="middle" fill="#ede9fe" font-size="10">📧 Daily Brief</text>
  <rect x="320" y="455" width="120" height="20" rx="4" fill="#7c3aed"/>
  <text x="380" y="469" text-anchor="middle" fill="#ede9fe" font-size="10">📊 Weekly Summary</text>
  <rect x="450" y="455" width="130" height="20" rx="4" fill="#7c3aed"/>
  <text x="515" y="469" text-anchor="middle" fill="#ede9fe" font-size="10">🎯 Deal-Specific Intel</text>
</svg>