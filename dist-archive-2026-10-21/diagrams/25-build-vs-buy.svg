<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font: bold 20px system-ui, sans-serif; fill: #1f2937; }
      .section-title { font: bold 14px system-ui, sans-serif; fill: white; }
      .item { font: 400 11px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 600 11px system-ui, sans-serif; fill: #6b7280; }
      .check { fill: #10b981; }
      .x { fill: #ef4444; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Build vs. Buy Decision Framework</text>
  
  <!-- BUILD Column -->
  <rect x="50" y="60" width="330" height="320" rx="8" fill="#8b5cf6"/>
  <text x="215" y="90" text-anchor="middle" class="section-title">🔨 BUILD (Custom)</text>
  <text x="215" y="110" text-anchor="middle" fill="#ede9fe" font-size="11">LangChain, CrewAI, custom pipelines</text>
  
  <!-- When to build -->
  <rect x="65" y="125" width="300" height="110" rx="4" fill="#ede9fe"/>
  <text x="75" y="145" class="label">✓ BUILD WHEN:</text>
  <text x="75" y="165" class="item">• Workflow is unique to your org</text>
  <text x="75" y="182" class="item">• High flexibility needed</text>
  <text x="75" y="199" class="item">• Team has engineering capacity</text>
  <text x="75" y="216" class="item">• Experimental/exploratory phase</text>
  <text x="75" y="233" class="item" fill="#7c3aed" font-weight="600">• You enjoy the tinkering</text>
  
  <!-- Risks -->
  <rect x="65" y="245" width="300" height="80" rx="4" fill="#fef3c7"/>
  <text x="75" y="265" class="label" fill="#92400e">⚠️ WATCH OUT FOR:</text>
  <text x="75" y="285" class="item">• Maintenance burden over time</text>
  <text x="75" y="302" class="item">• Bus factor (what if you leave?)</text>
  <text x="75" y="319" class="item">• Weekend debugging sessions</text>
  
  <!-- Example -->
  <rect x="65" y="335" width="300" height="35" rx="4" fill="#7c3aed"/>
  <text x="215" y="358" text-anchor="middle" fill="#ede9fe" font-size="11">Custom CI pipeline, internal RAG system</text>
  
  <!-- BUY Column -->
  <rect x="420" y="60" width="330" height="320" rx="8" fill="#3b82f6"/>
  <text x="585" y="90" text-anchor="middle" class="section-title">💳 BUY (Platform)</text>
  <text x="585" y="110" text-anchor="middle" fill="#dbeafe" font-size="11">Klue, Jasper, purpose-built tools</text>
  
  <!-- When to buy -->
  <rect x="435" y="125" width="300" height="110" rx="4" fill="#dbeafe"/>
  <text x="445" y="145" class="label">✓ BUY WHEN:</text>
  <text x="445" y="165" class="item">• Workflow is well-defined and stable</text>
  <text x="445" y="182" class="item">• Time-to-value matters</text>
  <text x="445" y="199" class="item">• Vendor handles maintenance</text>
  <text x="445" y="216" class="item">• Budget available ($30K+/year)</text>
  <text x="445" y="233" class="item" fill="#1d4ed8" font-weight="600">• Team prefers using, not building</text>
  
  <!-- Risks -->
  <rect x="435" y="245" width="300" height="80" rx="4" fill="#fef3c7"/>
  <text x="445" y="265" class="label" fill="#92400e">⚠️ WATCH OUT FOR:</text>
  <text x="445" y="285" class="item">• Limited flexibility</text>
  <text x="445" y="302" class="item">• Vendor lock-in</text>
  <text x="445" y="319" class="item">• Feature bloat you don't need</text>
  
  <!-- Example -->
  <rect x="435" y="335" width="300" height="35" rx="4" fill="#1d4ed8"/>
  <text x="585" y="358" text-anchor="middle" fill="#dbeafe" font-size="11">CI platform, content generation tool</text>
</svg>