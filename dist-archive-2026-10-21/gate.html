<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future of PMM — Access Required</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo {
            font-size: 14px;
            font-weight: 600;
            color: #0070f3;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 16px;
            font-weight: 700;
        }
        p {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input[type="password"] {
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #0070f3;
        }
        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #0070f3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0051a8;
        }
        .error {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .note {
            margin-top: 24px;
            font-size: 13px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SAP Product Marketing</div>
        <h1>Thanks for visiting!</h1>
        <p>This site contains internal SAP training materials and is now restricted to authorized users.</p>
        
        <form class="login-form" onsubmit="checkPassword(event)">
            <input type="password" id="password" placeholder="Enter access code" autocomplete="off">
            <button type="submit">Access Site</button>
            <div class="error" id="error">Incorrect access code. Please try again.</div>
        </form>
        
        <p class="note">If you need access, please contact your PMM team lead.</p>
    </div>
    
    <script>
        // Check if already authenticated
        if (localStorage.getItem('pmm_access') === 'granted') {
            const redirect = new URLSearchParams(window.location.search).get('r') || '/';
            window.location.href = redirect;
        }
        
        function checkPassword(e) {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            // Simple access code - not high security, just a gate
            if (pw === 'pmm2026' || pw === 'futureofpmm') {
                localStorage.setItem('pmm_access', 'granted');
                const redirect = new URLSearchParams(window.location.search).get('r') || '/index.html';
                window.location.href = redirect;
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
