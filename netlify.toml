[build]
  command = "echo 'Static site ready'"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty URLs - serve .html files without extension
[[redirects]]
  from = "/subscribe"
  to = "/subscribe.html"
  status = 200

[[redirects]]
  from = "/newsletter-preview"
  to = "/newsletter-preview.html"
  status = 200
