<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="reachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7"/>
      <stop offset="100%" style="stop-color:#bbf7d0"/>
    </linearGradient>
    <linearGradient id="activateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="embedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d4a6f"/>
    </linearGradient>
  </defs>
  
  <!-- Connecting line -->
  <line x1="180" y1="70" x2="620" y2="70" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  
  <!-- REACH -->
  <g transform="translate(133, 70)">
    <circle r="45" fill="url(#reachGrad)" stroke="#22c55e" stroke-width="3"/>
    <text text-anchor="middle" y="6" fill="#166534" font-family="Inter, sans-serif" font-size="14" font-weight="700">REACH</text>
  </g>
  <text x="133" y="140" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Everyone hears it</text>
  <text x="133" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">All-hands, exec comms</text>
  
  <!-- Arrow 1 -->
  <polygon points="195,70 210,62 210,78" fill="#22c55e"/>
  
  <!-- ACTIVATE -->
  <g transform="translate(400, 70)">
    <circle r="45" fill="url(#activateGrad)" stroke="#f59e0b" stroke-width="3"/>
    <text text-anchor="middle" y="6" fill="#92400e" font-family="Inter, sans-serif" font-size="13" font-weight="700">ACTIVATE</text>
  </g>
  <text x="400" y="140" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Many take part</text>
  <text x="400" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Learning + Labs</text>
  
  <!-- Arrow 2 -->
  <polygon points="462,70 477,62 477,78" fill="#f59e0b"/>
  
  <!-- EMBED -->
  <g transform="translate(666, 70)">
    <circle r="45" fill="url(#embedGrad)" stroke="#1a1a2e" stroke-width="3"/>
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="700">EMBED</text>
  </g>
  <text x="666" y="140" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11">It becomes the norm</text>
  <text x="666" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Playbooks in daily work</text>
</svg>